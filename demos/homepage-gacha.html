<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#efe4d1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Libre+Caslon+Text&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/tokens.css?v=20261027191214" /><link rel="stylesheet" href="/bar.css?v=20261027191214" />

        <style>
            /* The way in, on the hi-fi shelf wall's own surfaces: glossy beige
               zellige tiles with a strip of wool carpet below. As the page loads
               the illustration appears as a mosaic set into the tiles, piece by
               piece. Then the password; the right one moves the view into the
               illustration and on to the site. (The old dark intro is kept in
               archive/loading-dark.html.) */
            :root {
                --paper: #efe4d1;
                --ink: #2b231c;
                --body: rgba(43, 35, 28, 0.76);
                --mute: rgba(43, 35, 28, 0.6);
                --hair: rgba(43, 35, 28, 0.14);
                --border: rgba(43, 35, 28, 0.34);
                --slot: rgba(43, 35, 28, 0.06);
                --error: #a3341f;
                /* set by stage() from the hi-fi camera: one wall tile, half its
                   grout, the field's tile size and the field's width */
                --wt: 20px; --g: 0.75px; --u: 40px; --fwpx: 380px;
                --navy: #2f3b5c;   /* the painted signs' blue */
                --glaze-go: #c2683f; /* the terracotta of the pots */

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;
                --control: 48px;

                --text: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);
                --push: cubic-bezier(0.62, 0, 0.25, 1);

                --bar: 64px;
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--text);
                font-stretch: semi-condensed; /* as tokens.css --f-stretch; this page can't load tokens.css */
                -webkit-font-smoothing: antialiased;
            }
            .label {
                font: 500 var(--text-xs)/1.4 var(--text);
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }
            /* Moving between pages: the site's own top bar (bar.css) on the next
               page's background, so the bar holds still while the page unlocks */
            @view-transition { navigation: auto; }
            html.passing, html.passing body { background: var(--pass-bg); }

            /* Same bar as the hi-fi site: the name split across both ends */
            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 5;
                display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-3);
                padding: 0 var(--space-6);
                background: #fffdf9;
                border-bottom: 1px solid var(--hair);
                transition: opacity 400ms var(--out);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .mark:last-child { justify-self: end; }
            .bar .label { color: var(--mute); }

            .gate {
                position: relative; overflow: hidden;
                min-height: 100vh; min-height: 100svh;
                display: grid;
                grid-template-columns: minmax(0, 1fr) var(--fwpx);
                grid-template-rows: minmax(0, 1fr) auto;
                column-gap: 64px; row-gap: var(--space-5);
                padding: calc(var(--bar) + var(--space-5)) 9vw calc(10vh + 24px);
                background: #ebd1ad; /* the wall and floor: #backdrop, set by stage() */
            }

            /* ---------- The illustration, laid as a mosaic into the tiles ---------- */
            /* .art only reserves the space; the mosaic itself sits on the wall's
               tile grid (placed by the script), each piece one tile, grouted */
            .art { grid-column: 1; grid-row: 1 / 3; position: relative; z-index: 1; min-height: 0; }
            .mosaic {
                position: absolute; z-index: 1;
                transition: transform 1600ms var(--push);
                transform-origin: 50% 50%;
            }
            .mt {
                /* each piece fills its tile up to the wall's thin grout line */
                position: absolute; width: calc(var(--mt) - var(--g) * 2); height: calc(var(--mt) - var(--g) * 2);
                background-repeat: no-repeat; border-radius: 2px;
                box-shadow: inset 0 0 0 1px rgba(255, 250, 240, 0.25), inset 0 -6px 10px rgba(80, 55, 25, 0.18);
                opacity: 0; transform: scale(0.55);
                transition: opacity 320ms var(--out), transform 520ms cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            /* the glaze over each piece: a soft sheen toward the top left */
            .mt::after {
                content: ""; position: absolute; inset: 0; border-radius: inherit;
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 252, 244, 0.45), rgba(255, 252, 244, 0) 70%);
            }
            .mt.on { opacity: 1; transform: none; }

            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

            .foot {
                position: absolute; bottom: 40px; left: 48px; right: 48px; z-index: 1;
                display: flex; justify-content: space-between; align-items: flex-end;
                font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
                color: rgba(43, 35, 28, 0.7);
                transition: opacity 400ms var(--out);
            }

            /* ---------- Loading, then the password ---------- */
            .panel {
                grid-column: 2; grid-row: 1 / 3; align-self: end; position: relative; z-index: 3; width: 100%;
                transition: opacity 400ms var(--out);
            }
            /* set into the wall: the field is a row of glazed tiles on the wall's
               own grid (the script snaps it there); words get a pale halo */
            .panel .loader-line, .panel .error { text-shadow: 0 0 12px rgba(255, 250, 240, 0.9), 0 0 2px rgba(255, 250, 240, 0.9); }
            .panel.shake { animation: shake 380ms var(--out); }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-3px); }
            }
            .loader-line {
                display: flex; gap: var(--space-3); align-items: baseline; margin: 0 0 var(--space-5);
                font: 500 var(--text-lg)/1.2 var(--text);
            }
            .loader-pct { min-width: 4ch; color: var(--mute); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }

            .loader-line.done { visibility: hidden; }

            form {
                position: relative;
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready { opacity: 1; transform: none; }
            /* the field: six tiles of cream glaze to write on, then a tile to show
               the password and a painted tile to go in, all grouted like the wall */
            .field {
                position: relative; display: grid; height: var(--u);
                width: var(--fwpx);
                grid-template-columns: calc(var(--fwpx) - var(--u) * 2) var(--u) var(--u);
            }
            .field > * {
                margin: var(--g); min-width: 0; border: 0; border-radius: 2px;
                box-shadow: inset 0 0 0 1px rgba(255, 250, 240, 0.35), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 1px 2px rgba(80, 55, 25, 0.18);
            }
            .field input {
                padding: 0 var(--space-4); color: var(--navy);
                /* one long glazed tile across six of the wall's, its sheen a soft
                   band along the top like light on a curved glaze */
                background:
                    linear-gradient(180deg, rgba(255, 253, 247, 0.75), rgba(255, 253, 247, 0) 55%),
                    #f6ebd8;
                font: 400 var(--text-md) var(--brand); letter-spacing: 0.12em;
            }
            .field input::placeholder { color: rgba(47, 59, 92, 0.55); letter-spacing: 0.04em; font-style: italic; }
            .field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--navy), inset 0 -6px 10px rgba(80, 55, 25, 0.16); }
            .field button {
                display: grid; place-items: center; padding: 0; cursor: pointer;
                transition: filter 200ms var(--out);
            }
            .field button svg { width: 22px; height: 22px; pointer-events: none; }
            .field button:hover { filter: brightness(1.06); }
            .field button:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
            .eye {
                color: var(--navy);
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.7), rgba(255, 253, 247, 0) 70%), #f8eedd;
            }
            .eye[aria-pressed="true"] { background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.6), rgba(255, 253, 247, 0) 70%), #e6d4b6; }
            .enter {
                color: #fbf3e4;
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 236, 210, 0.45), rgba(255, 236, 210, 0) 70%), var(--glaze-go);
            }
            .error { min-height: 20px; margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.02em; }

            /* On the way in: everything but the illustration steps aside */
            .leaving .bar, .leaving .panel, .leaving .foot { opacity: 0; }
            .veil { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 380ms ease; }
            .veil.on { opacity: 1; }

            @media (max-width: 899px) {
                :root { --bar: 56px; }
                .bar { padding: 0 var(--space-4); }
                .bar .mark { font-size: 20px; }
                .gate {
                    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; align-content: start;
                    padding: calc(var(--bar) + var(--space-5)) var(--space-4) calc(12vh + var(--space-7));
                }
                .art, .panel { grid-column: 1; grid-row: auto; }
                .art { height: 62vw; max-height: 420px; }
                .panel { margin-top: var(--space-3); }
                .foot { left: var(--space-4); right: var(--space-4); bottom: 4vh; } /* on the carpet */
            }
            @media (prefers-reduced-motion: reduce) {
                .panel.shake { animation: none; }
                form, .mt, .mosaic { transition: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"></div>
        <script>
          (function () {
            // Someone who's already in is only moving between pages: show the
            // bar the next page has, with its switch already set.
            try { if (!localStorage.getItem("staticrypt_passphrase")) return; } catch (e) { return; }
            var path = location.pathname, fi;
            if (/\/hifi\//.test(path)) fi = "hifi";
            else if (/\/(index\.html)?$/.test(path)) fi = "lofi";
            else { try { fi = localStorage.getItem("portfolio.fi") === "hifi" ? "hifi" : "lofi"; } catch (e) { fi = "lofi"; } }
            var hifiPage = fi === "hifi" && /\/hifi\//.test(path);
            var icon = hifiPage
              ? '<span class="site-bar__icon" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.3 6.6a8 8 0 0 1 0 10.8"/></svg></span>'
              : '<span class="site-bar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>';
            var bar = document.createElement("header");
            bar.className = "site-bar";
            bar.id = "passing-bar";
            bar.setAttribute("aria-hidden", "true");
            bar.innerHTML = '<span class="site-bar__mark">CHLOE</span><div class="site-bar__tools"><nav class="site-bar__switch">'
              + '<a' + (fi === "lofi" ? ' aria-current="page"' : '') + '>Lo-fi</a><a' + (fi === "hifi" ? ' aria-current="page"' : '') + '>Hi-fi</a>'
              + '</nav>' + icon + '</div><span class="site-bar__mark site-bar__mark--end">MA</span>';
            document.body.appendChild(bar);
            var root = document.documentElement;
            root.style.setProperty("--pass-bg", hifiPage ? "#ffffff" : "var(--c-warm, #EDEAE5)");
            root.classList.add("passing");
          })();
        </script>

        <div id="staticrypt_content" class="hidden">
            <header class="bar">
                <span class="mark" aria-hidden="true">CHLOE</span>
                <span class="label">By invitation</span>
                <span class="mark" aria-hidden="true">MA</span>
            </header>

            <main class="gate" id="gate">
                <div class="backdrop" id="backdrop" aria-hidden="true"></div>
                <div class="art" id="art"></div>
                <div class="mosaic" id="mosaic" role="progressbar" aria-label="Opening up" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

                <h1 class="sr-only">Chloe Ma</h1>

                <div class="panel" id="panel">
                    <p class="loader-line" id="loader-line"><span class="loader-pct" id="loader-pct">0%</span></p>

                    <form id="staticrypt-form" action="#" method="post" novalidate aria-hidden="true">
                        <label class="sr-only" for="staticrypt-password">Password</label>
                        <div class="field">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                aria-describedby="gate-error"
                                autocomplete="current-password"
                                autocapitalize="off"
                                spellcheck="false"
                                placeholder="Password"
                                tabindex="-1"
                            />
                            <button type="button" class="eye" id="eye" aria-pressed="false" aria-label="Show password" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
                            <button type="submit" class="enter" aria-label="Enter" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
                        </div>

                        <p class="error" id="gate-error" role="status" aria-live="polite"></p>

                        <!-- always remembered on this device -->
                        <input id="staticrypt-remember" class="hidden" type="checkbox" name="remember" checked tabindex="-1" aria-hidden="true" />
                    </form>
                </div>

                <div class="foot" aria-hidden="true"><span>©2026</span><span>/Designing since 2018</span></div>
            </main>
            <div class="veil" id="veil"></div>
        </div>

                let cols = Math.max(4, Math.floor(a.width / C)), rows = Math.max(3, Math.floor(a.height / C));
                if (cols / rows > ASPECT) cols = Math.max(4, Math.round(rows * ASPECT)); else rows = Math.max(3, Math.round(cols / ASPECT));
                const left = onGrid(a.left - g.left + (a.width - cols * C) / 2, grid.gx, C);
                const top = onGrid(a.top - g.top + (a.height - rows * C) / 2, grid.gy, C);
                Object.assign(mosaic.style, { left: left + "px", top: top + "px", width: cols * C + "px", height: rows * C + "px" });
                mosaic.style.setProperty("--mt", C + "px");
                const order = [...Array(cols * rows).keys()].map((i) => [i, Math.random()]).sort((x, y) => x[1] - y[1]);
                mosaic.replaceChildren();
                pieces = [];
                order.forEach(([i], k) => {
                    const c = i % cols, r = Math.floor(i / cols), el = document.createElement("i");
                    el.className = "mt";
                    Object.assign(el.style, {
                        left: c * C + G + "px", top: r * C + G + "px",
                        backgroundImage: `url("${ILLUS}")`,
                        backgroundSize: `${cols * C}px ${rows * C}px`,
                        backgroundPosition: `${-c * C - G}px ${-r * C - G}px`,
                    });
                    mosaic.appendChild(el);
                    pieces.push({ el, at: (k + 1) / (cols * rows) });
                });
                setPieces(shown);
                snapField();
            }
            // The password field sits on the same grid: nudge the panel so the
            // field's tiles land exactly on the wall's (less the form's entrance
            // slide, if it's still sliding)
            function snapField() {
                panel.style.translate = "";
                const g = gate.getBoundingClientRect(), f = form.querySelector(".field").getBoundingClientRect();
                const x = f.left - g.left, y = f.top - g.top - new DOMMatrix(getComputedStyle(form).transform).m42;
                panel.style.translate = `${onGrid(x, grid.gx, grid.T) - x}px ${onGrid(y, grid.gy, grid.T) - y}px`;
            }
            function setPieces(p) { for (const piece of pieces) piece.el.classList.toggle("on", piece.at <= p + 1e-6); }
            addEventListener("resize", () => { if (!document.body.classList.contains("leaving")) layMosaic(); });

            // Loading follows the illustration and the fonts, never faster than MIN_MS.
            function load() {
                return new Promise((resolve) => {
                    let ready = 0;
                    const parts = 2, img = new Image();
                    img.onload = img.onerror = () => { ready++; };
                    img.src = ILLUS;
                    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ready++; });
                    layMosaic();
                    const start = performance.now();
                    const tick = (now) => {
                        const time = MIN_MS ? Math.min((now - start) / MIN_MS, 1) : 1;
                        const target = Math.min(time, ready / parts);
                        shown += (target - shown) * (still ? 1 : 0.08);
                        if (target >= 1 && shown > 0.995) shown = 1;
                        setPieces(shown);
                        const v = Math.round(shown * 100);
                        pct.textContent = v + "%";
                        mosaic.setAttribute("aria-valuenow", String(v));
                        if (shown >= 1) return resolve();
                        requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                });
            }

            function showPassword() {
                loaderLine.classList.add("done");
                mosaic.removeAttribute("role");
                form.removeAttribute("aria-hidden");
                form.querySelectorAll("[tabindex='-1']").forEach((el) => el.removeAttribute("tabindex"));
                form.classList.add("ready");
                input.focus({ preventScroll: window.innerWidth >= 900 });
            }

            /* ---------- Going in ---------- */
            // The homepage (index.html carries the marker) always opens on the
            // hi-fi site from here; the switch in its bar leads back to lo-fi.
            function toHifi(html) { return html.includes("/*hifi-first*/"); }
            // The colour the next page opens on, so the last moment fades into it
            function pageColour(html) {
                const m = html.match(/body\s*\{[^}]*?background(?:-color)?\s*:\s*(#[0-9a-f]{3,8})/i);
                return m ? m[1] : "#ffffff";
            }

            // The picture lifts off the wall piece by piece, leaving bare tiles;
            // the hi-fi site opens on those same tiles and slides its shelves in.
            async function goIn(colour) {
                document.documentElement.style.overflow = "hidden";
                document.body.classList.add("leaving");
                pieces.forEach(({ el }) => { el.style.transitionDelay = Math.random() * 700 + "ms"; el.classList.remove("on"); });
                await wait(1100);
                if (colour) {
                    veil.style.background = colour;
                    veil.classList.add("on");
                    await wait(400);
                }
            }

            input.addEventListener("input", () => { errorEl.textContent = ""; });

            eye.addEventListener("click", () => {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
                eye.setAttribute("aria-pressed", String(show));
                input.focus();
            });

            panel.addEventListener("animationend", () => panel.classList.remove("shake"));

            // Moving between pages (a remembered password): the sheet shows the
            // site's bar (see the script above) until the page unlocks.
            const passing = document.documentElement.classList.contains("passing");
            const opening = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    // the remembered password had run out: back to the way in
                    document.documentElement.classList.remove("passing");
                    $("passing-bar")?.remove();
                    $("staticrypt_loading").classList.add("hidden");
                    $("staticrypt_content").classList.remove("hidden");
                    await load();
                    await wait(still ? 0 : 250);
                    showPassword();
                }
            };
            // (not any sooner: written before load, the page comes out cut short)
            window.onload = opening;

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                if (busy || !form.classList.contains("ready")) return;

                const password = input.value;
                if (!password) {
                    errorEl.textContent = "Type the password first.";
                    input.focus();
                    return;
                }

                busy = true;
                holdPage = true;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember.checked);

                if (!isSuccessful) {
                    holdPage = false;
                    panel.classList.add("shake");
                    errorEl.textContent = "That's not the password. Check the spelling; capitals count.";
                    input.select();
                    busy = false;
                    return;
                }

                const hifi = toHifi(pendingPage);
                if (!still) await goIn(hifi ? null : pageColour(pendingPage));
                if (hifi) {
                    // the hi-fi loading screen opens on this same bare wall
                    try { sessionStorage.setItem("portfolio.enter", backdrop.outerHTML); } catch (e) {}
                    return location.replace("hifi/");
                }
                document.write(pendingPage);
                document.close();
            });
          })();
        </script>
    </body>
</html>
