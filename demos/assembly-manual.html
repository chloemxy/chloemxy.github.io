    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link

            rel="stylesheet"
        />

            /* The hi-fi site's loading screen, used as the way in: the six
               portfolio drawers fill as the page loads, then ask for the password.
               White paper, black ink, hairline rules, tracked uppercase labels. */

                --border: rgba(0, 0, 0, 0.34);
                --slot: #efefed;
                --error: #9b2c1f;

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;
                --control: 48px;

                --display: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--display);
                font-stretch: 92%;
                letter-spacing: 0.04em;
                -webkit-font-smoothing: antialiased;
            }
            .label {
                font: 400 var(--text-xs)/1.4 var(--display);
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }

            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: 64px;
                display: flex; align-items: center; justify-content: space-between;
                padding: 0 var(--space-6);
                background: var(--paper);
                border-bottom: 1px solid var(--hair);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .label { color: var(--mute); }

            .gate {
                min-height: 100vh; min-height: 100svh;
                display: grid; place-content: center; justify-items: center; gap: var(--space-5);
                padding: 96px var(--space-4) var(--space-7);
            }

            /* ---------- The six drawers (as on the hi-fi loading screen) ---------- */
            .loader-wall { display: grid; grid-template-columns: repeat(2, 72px); gap: 8px; }
            .loader-wall.rattle { animation: rattle 380ms var(--out); }
            .ld {
                --f: 0;
                display: grid; grid-template-rows: 1fr 12px; height: 54px;
                border: 1px solid var(--border); background: var(--paper);
                transition: transform 300ms var(--out), box-shadow 300ms var(--out), border-color 300ms;
            }
            .ld-glass { position: relative; overflow: hidden; background: var(--slot); }
            .ld-card {
                position: absolute; inset: 4px 6px 0; background: #edeae5 center / cover no-repeat;
                transform: translateY(calc((1 - var(--f)) * 105%));
            }
            .ld-glass::after {
                content: ""; position: absolute; inset: 0;
                background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.5) 50%, transparent 60%);
            }
            .ld-front { display: grid; place-items: center; border-top: 1px solid var(--hair); }
            .ld-knob { width: 5px; height: 5px; border-radius: 50%; background: var(--hair); transition: background 300ms; }
            .ld.filling { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12); border-color: var(--ink); }
            .ld.full { animation: ld-shut 420ms var(--out); }
            .ld.full .ld-knob { background: var(--ink); }
            /* opening: every drawer pulled out again, one after another */
            .ld.open { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12); border-color: var(--ink); animation: none; }
            @keyframes ld-shut { 0% { transform: translateY(-3px); } 60% { transform: translateY(1px); } 100% { transform: none; } }
            @keyframes rattle {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-3px); }
            }

            .loader-line {
                display: flex; gap: var(--space-3); align-items: baseline; margin: 0;
                font: 400 var(--text-lg)/1.2 var(--display);
            }
            .loader-pct { min-width: 4ch; color: var(--mute); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }

            /* ---------- The password, once the drawers are full ---------- */
            form {
                width: min(320px, 100%);
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready { opacity: 1; transform: none; }
            .lede { margin: 0 0 var(--space-4); color: var(--body); text-align: center; }
            .field-label { display: block; margin-bottom: var(--space-2); }
            .field { display: flex; }
            .field input {
                flex: 1; min-width: 0; height: var(--control);
                padding: 0 var(--space-4);
                border: 1px solid var(--border); border-right: 0; border-radius: 0;
                background: var(--paper); color: var(--ink);
                font: 400 var(--text-md) var(--display); letter-spacing: 0.08em;
            }
            .field input:focus { outline: none; border-color: var(--ink); }
            .field input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
            .eye {
                flex: none; height: var(--control); padding: 0 var(--space-4);
                border: 1px solid var(--border); border-radius: 0;
                background: var(--paper); color: var(--ink); cursor: pointer;
            }
            .eye:hover { background: var(--slot); }
            .error { min-height: 20px; margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.04em; }
            .remember {
                display: inline-flex; align-items: center; gap: var(--space-2);
                min-height: 44px; color: var(--body); cursor: pointer;
            }
            .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); cursor: pointer; }
            .enter {
                display: block; width: 100%; height: var(--control); margin-top: var(--space-2);
                border: 1px solid var(--ink); border-radius: 0;
                background: var(--ink); color: var(--paper); cursor: pointer;
                transition: background 200ms var(--out), color 200ms var(--out);
            }
            .enter:hover { background: var(--paper); color: var(--ink); }
            .help { margin: var(--space-5) 0 0; padding-top: var(--space-4); border-top: 1px solid var(--hair); color: var(--mute); text-align: center; }
            .help a { color: var(--ink); text-underline-offset: 3px; }

            @media (max-width: 899px) {
                .bar { height: 56px; padding: 0 var(--space-4); }
            }
            @media (prefers-reduced-motion: reduce) {
                .ld, .ld.full, .loader-wall.rattle { transition: none; animation: none; }
                form { transition: none; }
            }
        </style>
    </head>

            let busy = false;

            function draw(shown) {
                const n = drawers.length;
                drawers.forEach((d, i) => {
                    const f = Math.min(Math.max(shown * n - i, 0), 1);
                    d.style.setProperty("--f", f.toFixed(3));
                    d.classList.toggle("filling", f > 0 && f < 1);
                    d.classList.toggle("full", f >= 1);

                pct.textContent = v + "%";
                wall.setAttribute("aria-valuenow", String(v));

            // Fill the drawers: progress follows the pictures actually loading,
            // never faster than MIN_MS, and resolves once the last drawer is full.
            function fill() {
                return new Promise((resolve) => {
                    let loaded = 0;
                    HEROES.forEach((src, i) => {
                        const img = new Image();
                        const done = () => { loaded++; };
                        img.onload = () => { drawers[i].querySelector(".ld-card").style.backgroundImage = 'url("' + src + '")'; done(); };
                        img.onerror = done;
                        img.src = src;
                    });
                    const start = performance.now();
                    let shown = 0;
                    const tick = (now) => {
                        const time = MIN_MS ? Math.min((now - start) / MIN_MS, 1) : 1;
                        const target = Math.min(time, loaded / HEROES.length);
                        shown += (target - shown) * (still ? 1 : 0.12);
                        if (target >= 1 && shown > 0.995) { draw(1); return setTimeout(resolve, still ? 0 : 450); }

                        requestAnimationFrame(tick);
