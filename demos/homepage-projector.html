<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#efe4d1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Libre+Caslon+Text&display=swap"
            rel="stylesheet"
        />
        <script>
          // On the way into hi-fi (the password page left a note): put its
          // picture of the doors up now, before the stylesheets and fonts below
          // can hold the first paint back, so they never vanish between pages.
          // Hi-fi's own page does the same, and takes them down once its 3D
          // doors are ready behind.
          (function () {
            try {
              if (!/\/hifi\//.test(location.pathname) || !localStorage.getItem("staticrypt_passphrase")) return;
              var held = sessionStorage.getItem("portfolio.enter");
              if (!held || held.charAt(0) !== "<") return;
              var hold = document.createElement("div");
              hold.id = "gate-hold";
              hold.style.cssText = "position:fixed;inset:0;z-index:700;pointer-events:none";
              hold.innerHTML = held;
              document.documentElement.appendChild(hold);
              document.documentElement.style.background = "#d8c3a2";
              // the top bar stays above them, whatever its page's own styles say
              var keep = document.createElement("style");
              keep.textContent = ".bar, .site-bar { z-index: 800 !important; }";
              document.head.appendChild(keep);
            } catch (e) {}
          })();
        </script>
        <link rel="stylesheet" href="/tokens.css?v=20261102170340" /><link rel="stylesheet" href="/bar.css?v=20261102170340" />

        <style>
            /* The way in: the hi-fi scene's stained glass doors (plywood leaves
               glazed with the illustration's three panels, floral sidelights), as
               its own camera shows them. As the page loads, each piece of glass
               lights up in colour; then the password, at the foot of the doors.
               The right one opens the site, whose doors slide apart onto the shelf
               wall. (The old dark intro
               is kept in archive/loading-dark.html.) */
            :root {
                --paper: #efe4d1;
                --ink: #2b231c;
                --body: rgba(43, 35, 28, 0.76);
                --mute: rgba(43, 35, 28, 0.6);
                --hair: rgba(43, 35, 28, 0.14);
                --border: rgba(43, 35, 28, 0.34);
                --error: #a3341f;
                --u: 48px;             /* one tile of the password field */
                --navy: #2f3b5c;       /* the painted signs' blue */
                --glaze-go: #c2683f;   /* the terracotta of the pots */

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;

                --text: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);

                --bar: 64px;
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--text);
                font-stretch: semi-condensed; /* as tokens.css --f-stretch; this page can't load tokens.css */
                -webkit-font-smoothing: antialiased;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }
            /* Moving between pages: the site's own top bar (bar.css) on the next
               page's background, so the bar holds still while the page unlocks */
            @view-transition { navigation: auto; }
            html.passing, html.passing body { background: var(--pass-bg); }

            /* Same bar as the hi-fi site: the name split across both ends */
            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 5;
                display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-3);
                padding: 0 var(--space-6);
                background: #fffdf9;
                border-bottom: 1px solid var(--hair);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .mark:last-child { justify-self: end; }
            .bar .label { font: 500 var(--text-xs)/1.4 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
            /* Lo-fi / Hi-fi, as in the site's bar: two joined square buttons, the current one inked in */
            .gate-switch { display: flex; height: 40px; border: 1px solid var(--border); }
            .gate-switch button {
                padding: 0 var(--space-4); border: 0; background: transparent; color: var(--ink); cursor: pointer;
                font: 400 var(--text-xs)/1.4 var(--text); font-stretch: semi-condensed; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap;
                transition: background 200ms var(--out), color 200ms var(--out);
            }
            .gate-switch button + button { border-left: 1px solid var(--border); }
            .gate-switch button:hover { background: rgba(43, 35, 28, 0.06); }
            .gate-switch button[aria-pressed="true"] { background: var(--ink); color: #fffdf9; }

            .gate { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; background: #e9dcc4; }
            /* the doors, painted by the script (inline styles, so the hi-fi
               loading screen can wear them as they are) */
            .doors { position: fixed; inset: 0; z-index: 0; }
            .leaving .gate { background: transparent; }

            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

            /* ---------- Loading, then the password, at the foot of the doors ---------- */
            .panel {
                position: fixed; z-index: 3; left: 50%; bottom: 36px;
                width: min(380px, calc(100vw - 32px)); transform: translateX(-50%);
                transition: opacity 400ms var(--out);
            }
            .panel .error { text-shadow: 0 0 12px rgba(255, 250, 240, 0.95), 0 0 2px rgba(255, 250, 240, 0.95); }
            .panel.shake { animation: shake 380ms var(--out); }
            @keyframes shake {
                0%, 100% { transform: translateX(-50%); }
                25% { transform: translateX(calc(-50% - 6px)); }
                50% { transform: translateX(calc(-50% + 5px)); }
                75% { transform: translateX(calc(-50% - 3px)); }
            }

            form {
                position: relative;
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready, form.loading { opacity: 1; transform: none; }
            /* While the site loads, the long tile is the progress bar: it glazes
               terracotta left to right, the percentage at its end; at 100% it is
               the password field */
            .meter {
                grid-column: 1; grid-row: 1; position: relative; z-index: 1; pointer-events: none;
                display: flex; justify-content: space-between; align-items: center; padding: 0 var(--space-4);
                overflow: hidden; color: var(--navy); font: italic 400 var(--text-md) var(--brand); letter-spacing: 0.04em;
                transition: opacity 400ms var(--out);
            }
            .field > .meter { background: none; box-shadow: none; }
            .field input { grid-column: 1; grid-row: 1; } .field .eye { grid-column: 2; grid-row: 1; } .field .enter { grid-column: 3; grid-row: 1; }
            .meter::before {
                content: ""; position: absolute; inset: 0; z-index: -1; width: calc(var(--p, 0) * 100%);
                background: linear-gradient(180deg, rgba(255, 236, 210, 0.35), transparent 60%), rgba(194, 104, 63, 0.55);
            }
            .meter-pct { font-style: normal; font-variant-numeric: tabular-nums; }
            form.loading .field input::placeholder { color: transparent; }
            form.loading .eye, form.loading .enter { filter: saturate(0.4) brightness(0.92); opacity: 0.75; }
            form.ready .meter { opacity: 0; }
            /* the field: a long tile of cream glaze to write on, then a tile to
               show the password and a painted tile to go in */
            .field {
                position: relative; display: grid; height: var(--u);
                grid-template-columns: minmax(0, 1fr) var(--u) var(--u); gap: 3px;
            }
            .field > * {
                min-width: 0; border: 0; border-radius: 2px;
                box-shadow: inset 0 0 0 1px rgba(255, 250, 240, 0.35), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 2px 10px rgba(40, 30, 20, 0.25);
            }
            .field input {
                padding: 0 var(--space-4); color: var(--navy);
                background:
                    linear-gradient(180deg, rgba(255, 253, 247, 0.75), rgba(255, 253, 247, 0) 55%),
                    #f6ebd8;
                font: 400 var(--text-md) var(--brand); letter-spacing: 0.12em;
            }
            .field input::placeholder { color: rgba(47, 59, 92, 0.55); letter-spacing: 0.04em; font-style: italic; }
            .field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--navy), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 2px 10px rgba(40, 30, 20, 0.25); }
            .field button {
                display: grid; place-items: center; padding: 0; cursor: pointer;
                transition: filter 200ms var(--out);
            }
            .field button svg { width: 22px; height: 22px; pointer-events: none; }
            .field button:hover { filter: brightness(1.06); }
            .field button:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
            .eye {
                color: var(--navy);
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.7), rgba(255, 253, 247, 0) 70%), #f8eedd;
            }
            .eye[aria-pressed="true"] { background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.6), rgba(255, 253, 247, 0) 70%), #e6d4b6; }
            .enter {
                color: #fbf3e4;
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 236, 210, 0.45), rgba(255, 236, 210, 0) 70%), var(--glaze-go);
            }
            .error { position: absolute; left: 0; right: 0; top: calc(100% + 6px); min-height: 18px; margin: 0; text-align: center; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.02em; }

            /* On the way in, the password steps aside and the doors open */
            .leaving .panel, .panel.checking { opacity: 0; pointer-events: none; }
            .panel.checking { transition-duration: 220ms; }
            .veil { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 380ms ease; }
            .veil.on { opacity: 1; }

            /* Slow to load: an offer of the lo-fi way in */
            .slow { margin: 12px 0 0; text-align: center; font-size: var(--text-xs); color: var(--ink); text-shadow: 0 0 12px rgba(255, 250, 240, 0.95), 0 0 2px rgba(255, 250, 240, 0.95); }
            .slow button { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
            form.ready ~ .slow { display: none; }

            /* ---------- Lo-fi: the dark way in (archive/loading-dark.html) ---------- */
            .dark {
                --name-size: clamp(40px, 5.4vw, 84px);
                position: fixed; inset: 0; z-index: 4; overflow: hidden;
                display: grid; grid-template-columns: auto minmax(0, 560px); justify-content: center; align-items: center;
                column-gap: clamp(48px, 7vw, 112px);
                padding: calc(var(--bar) + var(--space-6)) 6vw var(--space-7);
                background: #161412; color: #fff;
                animation: dark-in 300ms var(--out);
            }
            @keyframes dark-in { from { opacity: 0; } }
            .dark .spark { position: absolute; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 500ms var(--out); }
            .dark .spark.on { animation: starAppear var(--d, 500ms) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
            .dark .spark.pop { z-index: 3; animation: sparkPop 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
            @keyframes starAppear {
                0%   { opacity: 0;    transform: scale(0.2)  rotate(-16deg); }
                55%  { opacity: 1;    transform: scale(1.09) rotate(5deg); }
                78%  { opacity: 0.88; transform: scale(0.96) rotate(1deg); }
                100% { opacity: 0.9;  transform: scale(1)    rotate(2deg); }
            }
            @keyframes sparkPop {
                0%   { opacity: 0; transform: scale(0.2) rotate(-18deg); }
                30%  { opacity: 1; transform: scale(1.08) rotate(4deg); }
                60%  { opacity: 0.7; transform: scale(0.95) rotate(1deg); }
                100% { opacity: 0; transform: scale(0.55) rotate(10deg); }
            }
            .dark .left { position: relative; z-index: 2; display: grid; gap: var(--space-6); justify-items: start; }
            .dark .art { position: relative; z-index: 1; min-width: 0; }
            .dark .illus {
                display: block; width: 100%; height: auto; max-height: calc(100svh - var(--bar) - 120px); object-fit: contain;
                border-radius: 14px; box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
                clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
                transition: transform 1600ms cubic-bezier(0.62, 0, 0.25, 1), border-radius 1600ms cubic-bezier(0.62, 0, 0.25, 1);
            }
            .dark .name {
                position: relative; z-index: 1;
                display: flex; flex-wrap: nowrap; white-space: nowrap; align-items: flex-end; margin: 0;
                font: 700 var(--name-size)/0.9 var(--text); font-stretch: semi-condensed;
                letter-spacing: -0.045em; text-transform: uppercase;
                transition: opacity 500ms var(--out);
            }
            .dark .name .l { display: inline-block; color: rgba(255, 255, 255, 0.28); transition: color 120ms ease; }
            .dark .name .l.in { color: #fff; }
            .dark .name .sp { display: inline-block; width: 0.28em; }
            .dark .foot {
                position: absolute; bottom: 40px; left: 48px; right: 48px; z-index: 1;
                display: flex; justify-content: space-between; align-items: flex-end;
                font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
                color: rgba(255, 255, 255, 0.65); transition: opacity 400ms var(--out);
            }
            .leaving .dark .name, .leaving .dark .foot, .leaving .dark .spark { opacity: 0; animation: none; }
            /* the password, beside the name, in the dark sheet's own plain style */
            .lofi .panel { position: relative; left: auto; right: auto; bottom: auto; width: 100%; min-width: 320px; transform: none; z-index: 2; }
            .lofi .panel.shake { animation-name: shake-dark; }
            @keyframes shake-dark { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
            .lofi .field { gap: 0; }
            .lofi .field > * { border: 1px solid rgba(255, 255, 255, 0.34); border-radius: 0; box-shadow: none; background: transparent; color: #fff; }
            .lofi .field > * + * { border-left: 0; }
            .lofi .field input { font: 400 var(--text-md) var(--text); letter-spacing: 0.08em; }
            .lofi .field input::placeholder { color: rgba(255, 255, 255, 0.5); font-style: normal; }
            .lofi .field input:focus { box-shadow: none; border-color: #fff; }
            .lofi .field button:hover { filter: none; background: rgba(255, 255, 255, 0.08); }
            .lofi .field button:focus-visible { outline-color: #fff; }
            .lofi .eye[aria-pressed="true"] { background: rgba(255, 255, 255, 0.12); }
            .lofi .enter { background: #fff; color: #161412; border-color: #fff; }
            .lofi .enter:hover { background: transparent; color: #fff; }
            .lofi .panel .error { text-shadow: none; color: #ff9b85; text-align: left; }
            .lofi .meter { color: #fff; }
            .lofi .meter::before { background: rgba(255, 255, 255, 0.16); }
            .lofi form.loading .eye, .lofi form.loading .enter { filter: none; opacity: 0.4; }

            @media (max-width: 899px) {
                .dark {
                    --name-size: clamp(36px, 11vw, 64px);
                    grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; row-gap: var(--space-6);
                    padding: calc(var(--bar) + var(--space-5)) var(--space-4) var(--space-6);
                }
                .dark .art { order: -1; width: min(100%, 480px); }
                .dark .illus { max-height: 42svh; }
                .dark .left { justify-items: center; width: min(100%, 380px); }
                .dark .foot { display: none; }
                .lofi .panel { min-width: 0; }
                .gate-switch button { padding: 0 var(--space-2); letter-spacing: 0.08em; }
            }
            @media (max-width: 899px) {
                :root { --bar: 56px; }
                .bar { padding: 0 var(--space-4); }
                .bar .mark { font-size: 20px; }
                .panel { bottom: 28px; }
            }
            @media (prefers-reduced-motion: reduce) {
                .dark, .dark .spark.on { animation: none; }
                .dark .spark { opacity: 0.9; }
                .dark .illus, .dark .name .l { transition: none; }
                .panel.shake { animation: none; }
                form { transition: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"></div>
        <script>
          (function () {
            // The site's own top bar (bar.css), drawn here for a page that's
            // still unlocking: also used by the way in below, on its way to hi-fi
            window.gateSiteBar = function (fi, hifiPage) {
              var icon = hifiPage
                ? '<span class="site-bar__icon" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.3 6.6a8 8 0 0 1 0 10.8"/></svg></span>'
                : '<span class="site-bar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>';
              // (a working bar: whichever copy is showing at a given moment,
              // its switch goes where it says)
              var bar = document.createElement("header");
              bar.className = "site-bar";
              bar.innerHTML = '<a class="site-bar__mark" href="/index.html">CHLOE</a><div class="site-bar__tools"><nav class="site-bar__switch" aria-label="Site version">'
                + '<a href="/index.html"' + (fi === "lofi" ? ' aria-current="page"' : '') + '>Lo-fi</a><a href="/hifi/"' + (fi === "hifi" ? ' aria-current="page"' : '') + '>Hi-fi</a>'
                + '</nav>' + icon + '</div><span class="site-bar__mark site-bar__mark--end" aria-hidden="true">MA</span>';
              return bar;
            };
            // Someone who's already in is only moving between pages: show the
            // bar the next page has, with its switch already set.
            try { if (!localStorage.getItem("staticrypt_passphrase")) return; } catch (e) { return; }
            var path = location.pathname, fi;
            if (/\/hifi\//.test(path)) fi = "hifi";
            else if (/\/(index\.html)?$/.test(path)) fi = "lofi";
            else { try { fi = localStorage.getItem("portfolio.fi") === "hifi" ? "hifi" : "lofi"; } catch (e) { fi = "lofi"; } }
            var hifiPage = fi === "hifi" && /\/hifi\//.test(path);
            var bar = window.gateSiteBar(fi, hifiPage);
            bar.id = "passing-bar";
            document.body.appendChild(bar);
            var root = document.documentElement;
            // (just in from the password page, the doors are already up: see the head)
            var held = document.getElementById("gate-hold");
            root.style.setProperty("--pass-bg", held ? "#d8c3a2" : hifiPage ? "#ffffff" : "var(--c-warm, #EDEAE5)");
            root.classList.add("passing");
          })();
        </script>

        <div id="staticrypt_content" class="hidden">
            <header class="bar">
                <span class="mark" aria-hidden="true">CHLOE</span>
                <nav class="gate-switch" aria-label="Site version"><button type="button" data-fi="lofi" aria-pressed="false">Lo-fi</button><button type="button" data-fi="hifi" aria-pressed="true">Hi-fi</button></nav>
                <span class="mark" aria-hidden="true">MA</span>
            </header>

            <main class="gate" id="gate">
                <div class="doors" id="doors" role="progressbar" aria-label="Opening up" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

                <h1 class="sr-only">Chloe Ma</h1>

                <div class="panel" id="panel">
                    <form id="staticrypt-form" action="#" method="post" novalidate aria-hidden="true">
                        <label class="sr-only" for="staticrypt-password">Password</label>
                        <div class="field">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                aria-describedby="gate-error"
                                autocomplete="current-password"
                                autocapitalize="off"
                                spellcheck="false"
                                placeholder="Password"
                                tabindex="-1"
                            />
                            <div class="meter" id="meter" aria-hidden="true"><span>Opening up …</span><span class="meter-pct" id="meter-pct">0%</span></div>
                            <button type="button" class="eye" id="eye" aria-pressed="false" aria-label="Show password" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
                            <button type="submit" class="enter" aria-label="Enter" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
                        </div>

                        <p class="error" id="gate-error" role="status" aria-live="polite"></p>

                        <!-- always remembered on this device -->
                        <input id="staticrypt-remember" class="hidden" type="checkbox" name="remember" checked tabindex="-1" aria-hidden="true" />
                    </form>
                    <p class="slow" id="slow" hidden>Taking a while? <button type="button" data-fi="lofi">See the site in lo-fi</button></p>
                </div>
            </main>
            <section class="dark hidden" id="dark" aria-hidden="true">
                <div class="left" id="dark-left"><p class="name" id="name"></p></div>
                <div class="art"><img class="illus" id="illus" alt="" /></div>
                <div class="foot"><span>&copy;2026</span><span>/Designing since 2018</span></div>
            </section>
            <div class="veil" id="veil"></div>
        </div>

        <script>
          // Wrapped so none of these names outlive the password page: the unlocked
          // page is written into this same window and declares its own.
          (() => {
            // these variables will be filled when generating the file - the template format is 'variable_name'
            const staticryptInitiator = ((function(){
  const exports = {};
  const cryptoEngine = ((function(){
  const exports = {};
  const { subtle } = crypto;

const IV_BITS = 16 * 8;
const HEX_BITS = 4;
const ENCRYPTION_ALGO = "AES-CBC";

/**
 * Translates between utf8 encoded hexadecimal strings
 * and Uint8Array bytes.
 */
const HexEncoder = {
    /**
     * hex string -> bytes
     * @param {string} hexString
     * @returns {Uint8Array}
     */
    parse: function (hexString) {

                    return;
                }
                if (toHifi(pendingPage)) {
                    // Hi-fi opens behind these same closed doors (its loading
                    // screen wears this picture of them until its own 3D doors are
                    // ready, then they slide apart onto the shelf wall). The top
                    // bar turns into the site's own.
                    // the doors go with a copy of the site's top bar, styled inline,
                    // inside the same overlay: the bar is anchored above them at
                    // every moment, on every page they're shown on
                    const siteBar = window.gateSiteBar("hifi", true);
                    document.querySelector(".bar").replaceWith(siteBar);
                    const barCopy = frozen(siteBar);
                    barCopy.removeAttribute("id"); barCopy.style.zIndex = "2";
                    try { sessionStorage.setItem("portfolio.enter", doorsHTML() + barCopy.outerHTML); } catch (e) {}
                    return location.replace("hifi/");
                }
                // the lo-fi way in: into the picture, which grows past the screen's edges
                if (lofi && !still) {
                    await wait(350);
                    const r = illus.getBoundingClientRect(), vw = innerWidth, vh = innerHeight;
                    const S = Math.max(vw / r.width, vh / r.height) * 1.25;
                    illus.style.transform = `translate(${vw / 2 - (r.left + r.width / 2)}px, ${vh / 2 - (r.top + r.height / 2)}px) scale(${S})`;
                    illus.style.borderRadius = "0";
                    await wait(1300);
                }
                // any other page: a fade into the page's own colour
                if (!still) {
                    veil.style.background = pageColour(pendingPage);
                    veil.classList.add("on");
                    await wait(400);
                }
                document.write(carryBar(pendingPage));
                document.close();
            });
          })();
        </script>
    </body>
</html>
