<!doctype html>

    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link

            rel="stylesheet"
        />

            /* The apothecary's look (see the hi-fi site): white paper, black ink,
               hairline rules, tracked uppercase labels, oiled-wood drawers with
               brass card frames and knobs. */
            :root {
                --paper: #ffffff;
                --ink: #000000;
                --body: rgba(0, 0, 0, 0.7);
                --mute: rgba(0, 0, 0, 0.6);
                --hair: rgba(0, 0, 0, 0.14);
                --border: rgba(0, 0, 0, 0.34);
                --slot: #efefed;
                --wood: #b98a5a;
                --wood-dark: #8f6640;
                --card: #f4ecd9;
                --brass: #b8862f;
                --error: #9b2c1f;

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px;
                --control: 48px;

                --ui: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --fell: "IM Fell English SC", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--ui);
                font-stretch: 92%;
                letter-spacing: 0.04em;
                -webkit-font-smoothing: antialiased;
            }
            .label {
                font: 400 var(--text-xs)/1.4 var(--ui);
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }

            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: 64px;
                display: flex; align-items: center; justify-content: space-between;
                padding: 0 var(--space-6);
                background: var(--paper);
                border-bottom: 1px solid var(--hair);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .label { color: var(--mute); }

            .gate {
                min-height: 100vh; min-height: 100svh;
                display: grid; place-items: center;
                padding: 96px var(--space-4) var(--space-7);
            }
            .gate-inner { width: 100%; max-width: 400px; }

            /* ---------- The drawers ---------- */
            .cabinet {
                display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
                padding: 6px;
                background: var(--wood-dark);
                border-radius: 2px;
            }
            .drawer {
                position: relative;
                aspect-ratio: 3 / 2;
                display: grid; justify-items: center; align-content: center; gap: 6px;
                background: linear-gradient(180deg, #c49866, var(--wood));
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
                transition: transform 360ms var(--out), box-shadow 360ms var(--out);
            }
            .drawer .card {
                min-width: 64%;
                padding: 2px 6px;
                border: 1.5px solid var(--brass);
                background: var(--card);
                font: 400 11px/1.3 var(--fell);
                letter-spacing: 0.02em;
                color: #3b2a19;
                text-align: center;
            }
            .drawer .knob {
                width: 8px; height: 8px; border-radius: 50%;
                background: radial-gradient(circle at 35% 35%, #e3c27a, var(--brass) 60%, #6e4f19);
                box-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
                transition: background 300ms var(--out);
            }
            /* a typed letter pulls the next drawer out a touch */
            .drawer.out {
                transform: translateY(-3px) scale(1.04);
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18), 0 6px 10px rgba(0, 0, 0, 0.28);
                z-index: 1;
            }
            .drawer.out .knob { background: radial-gradient(circle at 35% 35%, #555, #000 60%); }
            .cabinet.rattle { animation: rattle 380ms var(--out); }
            @keyframes rattle {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-3px); }
            }

            h1 {
                margin: var(--space-6) 0 0;
                font: 400 32px/1.25 var(--brand);
                letter-spacing: 0;
                text-wrap: balance;
            }
            .lede { margin: var(--space-2) 0 0; color: var(--body); max-width: 36ch; }

            form { margin-top: var(--space-5); }
            .field-label { display: block; margin-bottom: var(--space-2); }
            .field { display: flex; }
            .field input {
                flex: 1; min-width: 0; height: var(--control);
                padding: 0 var(--space-4);
                border: 1px solid var(--border); border-right: 0; border-radius: 0;
                background: var(--paper); color: var(--ink);
                font: 400 var(--text-md) var(--ui); letter-spacing: 0.08em;
            }
            .field input::placeholder { color: var(--mute); letter-spacing: 0.04em; }
            .field input:focus { outline: none; border-color: var(--ink); }
            .field input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
            .eye {
                flex: none; height: var(--control); padding: 0 var(--space-4);
                border: 1px solid var(--border); border-radius: 0;
                background: var(--paper); color: var(--ink); cursor: pointer;
            }
            .eye:hover { background: var(--slot); }

            .error { min-height: 20px; margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.04em; }
            .remember {
                display: inline-flex; align-items: center; gap: var(--space-2);
                min-height: 44px; color: var(--body); cursor: pointer;
            }
            .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); cursor: pointer; }

            .enter {
                display: block; width: 100%; height: var(--control); margin-top: var(--space-3);
                border: 1px solid var(--ink); border-radius: 0;
                background: var(--ink); color: var(--paper); cursor: pointer;
                transition: background 200ms var(--out), color 200ms var(--out);
            }
            .enter:hover { background: var(--paper); color: var(--ink); }

            .help { margin: var(--space-5) 0 0; padding-top: var(--space-4); border-top: 1px solid var(--hair); color: var(--mute); }
            .help a { color: var(--ink); text-underline-offset: 3px; }

            @media (max-width: 480px) {
                .bar { height: 56px; padding: 0 var(--space-4); }
                h1 { font-size: 28px; }
                .drawer .card { font-size: 10px; padding: 1px 4px; }
            }
            @media (prefers-reduced-motion: reduce) {
                .drawer, .drawer .knob { transition: none; }
                .cabinet.rattle { animation: none; }
            }
        </style>
    </head>

                    <p class="help">No password? Ask <a href="mailto:chloexy.ma@gmail.com">chloexy.ma@gmail.com</a></p>
                </div>
            </main>
        </div>
