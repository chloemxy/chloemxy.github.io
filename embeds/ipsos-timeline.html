<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#efe4d1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Libre+Caslon+Text&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/tokens.css?v=20261028011732" /><link rel="stylesheet" href="/bar.css?v=20261028011732" />

        <style>
            /* The way in: glass doors of three stained glass panels between
               floral sidelights, the illustration in glass and lit from behind. As
               the page loads, each piece of glass lights up in colour; then the
               password, at the foot of the doors. The right one slides them apart
               onto the hi-fi shelf wall. (The old dark intro
               is kept in archive/loading-dark.html.) */
            :root {
                --paper: #efe4d1;
                --ink: #2b231c;
                --body: rgba(43, 35, 28, 0.76);
                --mute: rgba(43, 35, 28, 0.6);
                --hair: rgba(43, 35, 28, 0.14);
                --border: rgba(43, 35, 28, 0.34);
                --error: #a3341f;
                --u: 48px;             /* one tile of the password field */
                --navy: #2f3b5c;       /* the painted signs' blue */
                --glaze-go: #c2683f;   /* the terracotta of the pots */

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;

                --text: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);

                --bar: 64px;
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--text);
                font-stretch: semi-condensed; /* as tokens.css --f-stretch; this page can't load tokens.css */
                -webkit-font-smoothing: antialiased;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }
            /* Moving between pages: the site's own top bar (bar.css) on the next
               page's background, so the bar holds still while the page unlocks */
            @view-transition { navigation: auto; }
            html.passing, html.passing body { background: var(--pass-bg); }

            /* Same bar as the hi-fi site: the name split across both ends */
            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 5;
                display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-3);
                padding: 0 var(--space-6);
                background: #fffdf9;
                border-bottom: 1px solid var(--hair);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .mark:last-child { justify-self: end; }
            .bar .label { font: 500 var(--text-xs)/1.4 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }

            .gate { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; background: #e9dcc4; }
            /* the doors, painted by the script (inline styles, so the hi-fi
               loading screen can wear them as they are) */
            .doors { position: fixed; inset: 0; z-index: 0; }
            .doors.open .gate-door.l { transform: translateX(-100%); }
            .doors.open .gate-door.r { transform: translateX(100%); }
            .leaving .gate { background: transparent; }

            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

            /* ---------- Loading, then the password, at the foot of the doors ---------- */
            .panel {
                position: fixed; z-index: 3; left: 50%; bottom: 36px;
                width: min(380px, calc(100vw - 32px)); transform: translateX(-50%);
                transition: opacity 400ms var(--out);
            }
            .panel .loader-line, .panel .error { text-shadow: 0 0 12px rgba(255, 250, 240, 0.95), 0 0 2px rgba(255, 250, 240, 0.95); }
            .panel.shake { animation: shake 380ms var(--out); }
            @keyframes shake {
                0%, 100% { transform: translateX(-50%); }
                25% { transform: translateX(calc(-50% - 6px)); }
                50% { transform: translateX(calc(-50% + 5px)); }
                75% { transform: translateX(calc(-50% - 3px)); }
            }
            .loader-line {
                position: absolute; left: 0; right: 0; bottom: calc(var(--u) + 28px); margin: 0; text-align: center;
                color: var(--ink); font: 500 var(--text-sm)/1 var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0.06em;
            }
            .loader-line.done { visibility: hidden; }

            form {
                position: relative;
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready { opacity: 1; transform: none; }
            /* the field: a long tile of cream glaze to write on, then a tile to
               show the password and a painted tile to go in */
            .field {
                position: relative; display: grid; height: var(--u);
                grid-template-columns: minmax(0, 1fr) var(--u) var(--u); gap: 3px;
            }
            .field > * {
                min-width: 0; border: 0; border-radius: 2px;
                box-shadow: inset 0 0 0 1px rgba(255, 250, 240, 0.35), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 2px 10px rgba(40, 30, 20, 0.25);
            }
            .field input {
                padding: 0 var(--space-4); color: var(--navy);
                background:
                    linear-gradient(180deg, rgba(255, 253, 247, 0.75), rgba(255, 253, 247, 0) 55%),
                    #f6ebd8;
                font: 400 var(--text-md) var(--brand); letter-spacing: 0.12em;
            }
            .field input::placeholder { color: rgba(47, 59, 92, 0.55); letter-spacing: 0.04em; font-style: italic; }
            .field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--navy), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 2px 10px rgba(40, 30, 20, 0.25); }
            .field button {
                display: grid; place-items: center; padding: 0; cursor: pointer;
                transition: filter 200ms var(--out);
            }
            .field button svg { width: 22px; height: 22px; pointer-events: none; }
            .field button:hover { filter: brightness(1.06); }
            .field button:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
            .eye {
                color: var(--navy);
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.7), rgba(255, 253, 247, 0) 70%), #f8eedd;
            }
            .eye[aria-pressed="true"] { background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.6), rgba(255, 253, 247, 0) 70%), #e6d4b6; }
            .enter {
                color: #fbf3e4;
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 236, 210, 0.45), rgba(255, 236, 210, 0) 70%), var(--glaze-go);
            }
            .error { position: absolute; left: 0; right: 0; top: calc(100% + 6px); min-height: 18px; margin: 0; text-align: center; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.02em; }

            /* On the way in, the password steps aside and the doors open */
            .leaving .panel { opacity: 0; }
            .veil { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 380ms ease; }
            .veil.on { opacity: 1; }

            @media (max-width: 899px) {
                :root { --bar: 56px; }
                .bar { padding: 0 var(--space-4); }
                .bar .mark { font-size: 20px; }
                .panel { bottom: 28px; }
            }
            @media (prefers-reduced-motion: reduce) {
                .panel.shake { animation: none; }
                form { transition: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"></div>
        <script>
          (function () {
            // The site's own top bar (bar.css), drawn here for a page that's
            // still unlocking: also used by the way in below, on its way to hi-fi
            window.gateSiteBar = function (fi, hifiPage) {
              var icon = hifiPage
                ? '<span class="site-bar__icon" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.3 6.6a8 8 0 0 1 0 10.8"/></svg></span>'
                : '<span class="site-bar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>';
              var bar = document.createElement("header");
              bar.className = "site-bar";
              bar.setAttribute("aria-hidden", "true");
              bar.innerHTML = '<span class="site-bar__mark">CHLOE</span><div class="site-bar__tools"><nav class="site-bar__switch">'
                + '<a' + (fi === "lofi" ? ' aria-current="page"' : '') + '>Lo-fi</a><a' + (fi === "hifi" ? ' aria-current="page"' : '') + '>Hi-fi</a>'
                + '</nav>' + icon + '</div><span class="site-bar__mark site-bar__mark--end">MA</span>';
              return bar;
            };
            // Someone who's already in is only moving between pages: show the
            // bar the next page has, with its switch already set.
            try { if (!localStorage.getItem("staticrypt_passphrase")) return; } catch (e) { return; }
            var path = location.pathname, fi;
            if (/\/hifi\//.test(path)) fi = "hifi";
            else if (/\/(index\.html)?$/.test(path)) fi = "lofi";
            else { try { fi = localStorage.getItem("portfolio.fi") === "hifi" ? "hifi" : "lofi"; } catch (e) { fi = "lofi"; } }
            var hifiPage = fi === "hifi" && /\/hifi\//.test(path);
            var bar = window.gateSiteBar(fi, hifiPage);
            bar.id = "passing-bar";
            document.body.appendChild(bar);
            var root = document.documentElement;
            // just in from the password page: keep its closed doors up, which the
            // hi-fi loading screen then takes over, so nothing flashes between
            var held = null;
            try { held = hifiPage && sessionStorage.getItem("portfolio.enter"); } catch (e) {}
            if (held && held.charAt(0) === "<") {
              var doors = document.createElement("div");
              doors.style.cssText = "position:fixed;inset:0;z-index:0";
              doors.innerHTML = held;
              document.body.insertBefore(doors, bar);
            }
            root.style.setProperty("--pass-bg", held ? "#e9dcc4" : hifiPage ? "#ffffff" : "var(--c-warm, #EDEAE5)");
            root.classList.add("passing");
          })();
        </script>

        <div id="staticrypt_content" class="hidden">
            <header class="bar">
                <span class="mark" aria-hidden="true">CHLOE</span>
                <span class="label">By invitation</span>
                <span class="mark" aria-hidden="true">MA</span>
            </header>

            <main class="gate" id="gate">
                <div class="doors" id="doors" role="progressbar" aria-label="Opening up" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

                <h1 class="sr-only">Chloe Ma</h1>

                <div class="panel" id="panel">
                    <p class="loader-line" id="loader-line"><span class="loader-pct" id="loader-pct">0%</span></p>

                    <form id="staticrypt-form" action="#" method="post" novalidate aria-hidden="true">
                        <label class="sr-only" for="staticrypt-password">Password</label>
                        <div class="field">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                aria-describedby="gate-error"
                                autocomplete="current-password"
                                autocapitalize="off"
                                spellcheck="false"
                                placeholder="Password"
                                tabindex="-1"
                            />
                            <button type="button" class="eye" id="eye" aria-pressed="false" aria-label="Show password" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
                            <button type="submit" class="enter" aria-label="Enter" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
                        </div>

                        <p class="error" id="gate-error" role="status" aria-live="polite"></p>

                        <!-- always remembered on this device -->
                        <input id="staticrypt-remember" class="hidden" type="checkbox" name="remember" checked tabindex="-1" aria-hidden="true" />
                    </form>
                </div>
            </main>
            <div class="veil" id="veil"></div>
        </div>

a2078f738839eb76","isRememberEnabled":true,"rememberDurationInDays":30,"staticryptSaltUniqueVariableName":"ef5aeea5389fcb38dcf9b27da875ba41"};

            // the middle of the centre panel into two leaves. While loading, each

            // (img/gate/doors-order.png holds each piece's moment), drawn by a
            // small WebGL layer over the leaves; without WebGL the glass simply

            const SEAM = 0.4989;   // the middle of the centre panel, across the picture
            let fill = 0, doorsImg = null, orderImg = null, cover = null;

            function layout() {
                const W = innerWidth, H = innerHeight, bar = document.querySelector(".bar, .site-bar").offsetHeight;
                const s = (H - bar) / DOORS_H, bw = DOORS_W * s, bh = DOORS_H * s;
                const ox = (W - bw) / 2, oy = bar + (H - bar - bh) / 2;
                return { W, H, bw, bh, ox, oy, seam: Math.round(ox + bw * SEAM) };

                    " cl = (cl - 0.5) * 0.82 + 0.56;" +
