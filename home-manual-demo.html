        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#161412" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

                --glow: #ffc56b;
                --mist: rgba(239, 230, 216, 0.68);
                --line: rgba(239, 230, 216, 0.16);
                --error: #ffb38a;

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-sm: 14px; --text-md: 16px; --text-2xl: 32px; --text-3xl: 40px;
                --control: 48px;
                --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }

            html, body { margin: 0; background: var(--night); }
            body {
                color: var(--stem);
                font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                font-size: var(--text-md);
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }

            /* Blank night while a remembered password auto-decrypts: no spinner flash */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }

            .gate {
                min-height: 100vh;
                min-height: 100svh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: var(--space-6) var(--space-4);
            }
            .gate-inner { width: 100%; max-width: 400px; text-align: center; }

            h1 {
                margin: 0;
                font-size: var(--text-3xl);
                line-height: 44px;
                font-weight: 600;
                letter-spacing: -0.02em;
                text-wrap: balance;
            }
            .lede {
                margin: var(--space-3) auto 0;
                max-width: 32ch;
                color: var(--mist);
                text-wrap: pretty;
            }

            form { margin-top: var(--space-6); }

            /* ---------- The ring ---------- */
            .ring {
                position: relative;
                width: 100%;
                aspect-ratio: 400 / 220;
            }
            .ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
            .ring .front { pointer-events: none; }
            .ring.shake { animation: shiver 420ms var(--ease-out); }

            .field {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 66%;
                display: flex;
                gap: var(--space-2);
            }
            .field input {
                flex: 1;
                min-width: 0;
                height: var(--control);
                padding: 0 var(--space-4);
                border-radius: 999px;
                border: 1px solid var(--line);
                background: rgba(22, 20, 18, 0.8);
                color: var(--stem);
                font: inherit;
                letter-spacing: 0.04em;
                text-align: center;
                transition: border-color 200ms var(--ease-out);
            }
            .field input::placeholder { color: var(--mist); letter-spacing: 0; }
            .field input:hover { border-color: rgba(239, 230, 216, 0.32); }
            .eye {
                flex: none;
                width: var(--control);
                height: var(--control);
                display: grid;
                place-items: center;
                border-radius: 999px;
                border: 1px solid var(--line);
                background: rgba(22, 20, 18, 0.8);
                color: var(--mist);
                cursor: pointer;
                transition: color 200ms var(--ease-out), border-color 200ms var(--ease-out);
            }
            .eye:hover { color: var(--stem); border-color: rgba(239, 230, 216, 0.32); }
            .eye svg { width: 20px; height: 20px; }

            :focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
            .field input:focus { outline: none; }
            .field input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

            /* Mushrooms */
            .m .glow { opacity: 0; transition: opacity 320ms var(--ease-out); }
            .m .cap { transition: fill 320ms var(--ease-out); }
            .m.lit .glow { opacity: 1; }
            .m.lit .cap { fill: #f2782c; }
            .m .spore { opacity: 0; }
            .m.lit .spore { animation: spore 900ms var(--ease-out) 1; }
            .m .sprout {
                transform-box: fill-box;
                transform-origin: 50% 100%;
                animation: sprout 520ms var(--ease-out) both;
                animation-delay: calc(var(--i) * 45ms + 120ms);
            }

            @keyframes sprout { from { transform: scale(0.2, 0); } to { transform: scale(1, 1); } }
            @keyframes spore {
                0%   { opacity: 0; transform: translateY(0); }
                20%  { opacity: 1; }
                100% { opacity: 0; transform: translateY(-18px); }
            }
            @keyframes shiver {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-8px); }
                40% { transform: translateX(8px); }
                60% { transform: translateX(-4px); }
                80% { transform: translateX(4px); }
            }

            /* ---------- Below the ring ---------- */
            .error {
                min-height: 24px;
                margin: var(--space-2) 0 0;
                font-size: var(--text-sm);
                color: var(--error);
            }
            .remember {
                display: inline-flex;
                align-items: center;
                gap: var(--space-2);
                min-height: 44px;
                margin-top: var(--space-2);
                color: var(--mist);
                font-size: var(--text-sm);
                cursor: pointer;
            }
            .remember input { width: 20px; height: 20px; margin: 0; accent-color: var(--cap); cursor: pointer; }

            .enter {
                display: block;
                width: 100%;
                height: var(--control);
                margin-top: var(--space-4);
                border: 0;
                border-radius: 999px;
                background: var(--cap);
                color: var(--night);
                font: inherit;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 200ms var(--ease-out), transform 120ms var(--ease-out);
            }
            .enter:hover { background: var(--cap-hover); }
            .enter:active { transform: scale(0.98); }

            .help { margin: var(--space-5) 0 0; font-size: var(--text-sm); color: var(--mist); }
            .help a { color: var(--stem); text-underline-offset: 3px; }

            @media (max-width: 480px) {
                h1 { font-size: var(--text-2xl); line-height: 36px; }
                .field { width: 72%; }
            }

            @media (prefers-reduced-motion: reduce) {
                .m .sprout, .m.lit .spore, .ring.shake { animation: none; }
                .m .glow, .m .cap { transition: none; }
            }
        </style>
    </head>

                            Remember me on this device

                        <button type="submit" class="enter">Step in</button>
                    </form>

                    <p class="help">No password? Ask <a href="mailto:chloexy.ma@gmail.com">chloexy.ma@gmail.com</a></p>
                </div>
            </main>
        </div>
