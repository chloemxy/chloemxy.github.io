<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Libre+Caslon+Text&display=swap"
            rel="stylesheet"
        />

        <style>
            /* The way in: an old arched barn door with the name over it. Flowers
               grow out of the name while the page loads; the right password
               swings the door open and the view moves through the doorway to
               the shelf wall inside. White paper, black ink, hairline rules. */
            :root {
                --paper: #ffffff;
                --ink: #000000;
                --body: rgba(0, 0, 0, 0.7);
                --mute: rgba(0, 0, 0, 0.6);
                --hair: rgba(0, 0, 0, 0.14);
                --border: rgba(0, 0, 0, 0.34);
                --slot: #efefed;
                --error: #9b2c1f;

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;
                --control: 48px;

                --display: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);
                --swing: cubic-bezier(0.5, 0, 0.15, 1);
                --push: cubic-bezier(0.62, 0, 0.25, 1);

                /* one unit of the door drawing (320 x 410): as big as the screen allows,
                   leaving room for the password beside it */
                --u: min(calc((100svh - 112px) / 410), calc((100vw - 480px) / 320));
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--display);
                font-stretch: 92%;
                letter-spacing: 0.04em;
                -webkit-font-smoothing: antialiased;
            }
            .label {
                font: 400 var(--text-xs)/1.4 var(--display);
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }

            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 5;
                display: flex; align-items: center; justify-content: space-between;
                padding: 0 var(--space-6);
                background: var(--paper);
                border-bottom: 1px solid var(--hair);
                transition: opacity 400ms var(--out);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .label { color: var(--mute); }

            .gate {
                min-height: 100vh; min-height: 100svh;
                display: grid; justify-content: center; align-content: center; justify-items: center;
                grid-template-columns: auto; gap: var(--space-5);
                padding: 88px var(--space-4) var(--space-7);
            }
            @media (min-width: 900px) {
                .gate { grid-template-columns: auto 320px; column-gap: 64px; align-items: center; padding-bottom: var(--space-5); }
            }

            /* ---------- The name and the door ---------- */
            .stage {
                position: relative;
                transition: transform 1700ms var(--push);
                will-change: transform;
            }
            .stage > canvas { transition: opacity 500ms var(--out); }
            /* painted across the door, so the flowers grow up the planks */
            .name {
                position: absolute; z-index: 1; left: 0; right: 0; top: calc(184 * var(--u));
                display: flex; justify-content: center; margin: 0;
                font: 800 calc(36 * var(--u))/0.9 var(--display); font-stretch: 100%;
                letter-spacing: -0.045em; text-transform: uppercase;
                color: #f3ead7; text-shadow: 0 calc(2 * var(--u)) 0 rgba(40, 20, 8, 0.55);
                transition: opacity 500ms var(--out);
            }
            .name .l { display: inline-block; opacity: 0; transform: translateY(-0.3em); transition: opacity 240ms, transform 560ms cubic-bezier(0.34, 1.56, 0.64, 1); }
            .name .l.in { opacity: 1; transform: none; }
            .name .sp { width: 0.28em; }

            .doorway { position: relative; z-index: 0; width: calc(320 * var(--u)); height: calc(410 * var(--u)); }
            .doorway.rattle { animation: rattle 380ms var(--out); }
            .frame { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
            .opening {
                position: absolute; z-index: 1;
                left: calc(30 * var(--u)); top: calc(26 * var(--u));
                width: calc(260 * var(--u)); height: calc(370 * var(--u));
                border-radius: calc(130 * var(--u)) calc(130 * var(--u)) 0 0;
                overflow: hidden; background: #2a1d14;
                perspective: calc(900 * var(--u));
            }
            /* the room behind the door: the hi-fi shelf wall */
            .room {
                position: absolute; left: 50%; top: 50%;
                width: calc(700 * var(--u)); max-width: none; height: auto;
                transform: translate(-50%, -50%) scale(var(--room, 1));
                transition: transform 1700ms var(--push);
            }
            .shade {
                position: absolute; inset: 0;
                background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(30, 18, 8, 0.15), rgba(20, 12, 6, 0.8));
                transition: opacity 1400ms var(--out);
            }
            .leaf { position: absolute; top: 0; width: 50%; height: 100%; transition: transform 1400ms var(--swing); }
            .leaf svg { display: block; width: 100%; height: 100%; transition: filter 1400ms var(--swing); }
            .leaf.l { left: 0; transform-origin: 0 50%; }
            .leaf.r { right: 0; transform-origin: 100% 50%; }
            /* swinging inward, away from the viewer */
            .doorway.open .leaf.l { transform: rotateY(82deg); }
            .doorway.open .leaf.r { transform: rotateY(-82deg); }
            .doorway.open .leaf svg { filter: brightness(0.5); }
            .doorway.open .shade { opacity: 0.35; }

            @keyframes rattle {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-3px); }
            }

            /* ---------- Loading, then the password ---------- */
            .panel { width: min(320px, 100%); transition: opacity 400ms var(--out); }
            .loader-line {
                display: flex; gap: var(--space-3); align-items: baseline; margin: 0 0 var(--space-5);
                font: 400 var(--text-lg)/1.2 var(--display);
            }
            .loader-pct { min-width: 4ch; color: var(--mute); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }
            @media (max-width: 899px) { .loader-line { justify-content: center; } }

            form {
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready { opacity: 1; transform: none; }
            .lede { margin: 0 0 var(--space-4); color: var(--body); }
            .field-label { display: block; margin-bottom: var(--space-2); }
            .field { display: flex; }
            .field input {
                flex: 1; min-width: 0; height: var(--control);
                padding: 0 var(--space-4);
                border: 1px solid var(--border); border-right: 0; border-radius: 0;
                background: var(--paper); color: var(--ink);
                font: 400 var(--text-md) var(--display); letter-spacing: 0.08em;
            }
            .field input:focus { outline: none; border-color: var(--ink); }
            .field input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
            .eye {
                flex: none; height: var(--control); padding: 0 var(--space-4);
                border: 1px solid var(--border); border-radius: 0;
                background: var(--paper); color: var(--ink); cursor: pointer;
            }
            .eye:hover { background: var(--slot); }
            .error { min-height: 20px; margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.04em; }
            .remember {
                display: inline-flex; align-items: center; gap: var(--space-2);
                min-height: 44px; color: var(--body); cursor: pointer;
            }
            .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); cursor: pointer; }
            .enter {
                display: block; width: 100%; height: var(--control); margin-top: var(--space-2);
                border: 1px solid var(--ink); border-radius: 0;
                background: var(--ink); color: var(--paper); cursor: pointer;
                transition: background 200ms var(--out), color 200ms var(--out);
            }
            .enter:hover { background: var(--paper); color: var(--ink); }
            .help { margin: var(--space-5) 0 0; padding-top: var(--space-4); border-top: 1px solid var(--hair); color: var(--mute); }
            .help a { color: var(--ink); text-underline-offset: 3px; }

            /* On the way in: everything but the door steps aside */
            .leaving .bar, .leaving .panel, .leaving .name, .leaving .stage > canvas { opacity: 0; }
            .veil { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 380ms ease; }
            .veil.on { opacity: 1; }

            @media (max-width: 899px) {
                :root { --u: min(calc((100vw - 32px) / 320), calc((100svh - 120px) / 410)); }
                .bar { height: 56px; padding: 0 var(--space-4); }
                .gate { padding-top: 56px; }
            }
            @media (prefers-reduced-motion: reduce) {
                .doorway.rattle { animation: none; }
                form, .name .l { transition: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"></div>

        <div id="staticrypt_content" class="hidden">
            <header class="bar">
                <span class="mark">MA</span>
                <span class="label">By invitation</span>
            </header>

            <main class="gate">
                <div class="stage" id="stage">
                    <h1 class="name" id="name" aria-label="Chloe Ma"></h1>
                    <div class="doorway" id="doorway" role="progressbar" aria-label="Opening up" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="opening" id="opening">
                            <img class="room" id="room" alt="" />
                            <div class="shade" id="shade"></div>
                            <div class="leaf l" id="leaf-l"></div>
                            <div class="leaf r" id="leaf-r"></div>
                        </div>
                        <svg class="frame" id="frame" viewBox="-30 -26 320 410" aria-hidden="true"></svg>
                    </div>
                </div>

                <div class="panel" id="panel">
                    <p class="loader-line"><span class="loader-text" id="loader-text">Opening up</span><span class="loader-pct" id="loader-pct">0%</span></p>

                    <form id="staticrypt-form" action="#" method="post" novalidate aria-hidden="true">
                        <p class="lede">This portfolio is shared by invitation. Enter the password you were given.</p>
                        <label class="field-label label" for="staticrypt-password">Password</label>
                        <div class="field">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                aria-describedby="gate-error"
                                autocomplete="current-password"
                                autocapitalize="off"
                                spellcheck="false"
                                tabindex="-1"
                            />
                            <button type="button" class="eye label" id="eye" aria-pressed="false" tabindex="-1">Show</button>
                        </div>

                        <p class="error" id="gate-error" role="status" aria-live="polite"></p>

                        <label id="staticrypt-remember-label" class="remember hidden">
                            <input id="staticrypt-remember" type="checkbox" name="remember" checked tabindex="-1" />
                            Remember me on this device
                        </label>

                        <button type="submit" class="enter label" tabindex="-1">Open the door</button>

                        <p class="help">No password? Ask <a href="mailto:chloexy.ma@gmail.com" tabindex="-1">chloexy.ma@gmail.com</a></p>
                    </form>
                </div>
            </main>
            <div class="veil" id="veil"></div>
        </div>

        <script>
/* ══════════════════════════════════
   INTRO GARDEN — vines and flowers grow out of each letter of the name as it
   lands. Everything is drawn from code on two canvases, one behind the letters
   and one in front, so a stem can pass behind a letter and come out over it.
   Usage: const garden = introGarden(introEl); garden.grow(letterSpan);
   Options: introGarden(el, { petals: [...], stem, leaves: [...], centre, reach })
   (reach lengthens the upward stems, so blooms clear smaller lettering)
══════════════════════════════════ */
window.introGarden = function (intro, colours = {}) {
  const quiet = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (quiet || !intro) return { grow() {}, remaining() { return 0; } };

  const PETALS = colours.petals || ['#9b8cf8', '#f97316', '#06b6d4', '#ffffff', '#c4b5fd'];
  const STEM = colours.stem || '#84cc16', LEAF = colours.leaves || ['#84cc16', '#65a30d'];
  const CENTRE = colours.centre || '#161412', VEIN = 'rgba(22,20,18,0.45)', REACH = colours.reach || 1;

  /* Two layers: back sits under the name (z 0), front over it (z 2) */
  function layer(z) {
    const c = document.createElement('canvas');
    c.setAttribute('aria-hidden', 'true');
    c.style.cssText = `position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:${z}`;
    intro.appendChild(c);
    return c.getContext('2d');
  }
  const back = layer(0), front = layer(2);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit() {
    for (const g of [back, front]) {
      g.canvas.width = intro.clientWidth * dpr;
      g.canvas.height = intro.clientHeight * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }
  fit();
  window.addEventListener('resize', fit);

  /* ── Helpers ── */
  let seed = (Math.random() * 1e9) | 0;            // a different garden on every replay
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
  const pick = a => a[Math.floor(rnd() * a.length)];
  const easeOut = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const spring = t => t <= 0 ? 0 : t >= 1.6 ? 1 : 1 - Math.exp(-5 * t) * Math.cos(11 * t);  // overshoots, then settles

  /* A wandering stem: walk forward in small steps while the heading sways */
  function vine(x, y, dir, len, sway, waves, phase, n = 30) {
    const pts = [[x, y]], step = len / n;
    for (let i = 1; i <= n; i++) {
      const u = i / n, a = dir + sway * Math.sin(u * Math.PI * waves + phase) * Math.min(1, u * 2.5);
      x += Math.cos(a) * step; y += Math.sin(a) * step;
      pts.push([x, y]);
    }
    return pts;
  }
  /* An arching stem from one point to another, lifted by `lift` */
  function arch(a, b, lift, n = 30) {
    const c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - lift], pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]);
    }
    return pts;
  }
  /* Finish a stem in a little spiral */
  function curl(pts, side, r) {
    const [x, y] = pts[pts.length - 1], [px, py] = pts[pts.length - 2];
    const a = Math.atan2(y - py, x - px), cx = x - Math.sin(a) * side * r, cy = y + Math.cos(a) * side * r;
    const a0 = Math.atan2(y - cy, x - cx);
    for (let i = 1; i <= 16; i++) {
      const u = i / 16, t = a0 + side * u * Math.PI * 1.7, rr = r * (1 - 0.55 * u);
      pts.push([cx + Math.cos(t) * rr, cy + Math.sin(t) * rr]);
    }
    return pts;
  }
  const heading = (pts, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  };

  /* ── Garden state ── */
  const stems = [], leaves = [], flowers = [];
  let lastLetter = null, raf = 0;

  /* Split a stem into stretches that alternate behind and in front of the letters.
     It always starts behind, so it looks like it grows out of the letter. */
  function weave() {
    const cuts = [0];
    let u = 0.18 + rnd() * 0.25;
    while (u < 0.9) { cuts.push(u); u += 0.25 + rnd() * 0.35; }
    cuts.push(1);
    return cuts.slice(1).map((b, i) => ({ a: cuts[i], b, front: i % 2 === 1 }));
  }

  function addStem(pts, w, t0, dur, tip, size) {
    stems.push({ pts, w, t0, dur, runs: weave() });
    // leaves along the way, appearing as the stem reaches them
    const n = Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const u = 0.25 + rnd() * 0.55, i = Math.round(u * (pts.length - 1));
      const side = rnd() < 0.5 ? -1 : 1;
      leaves.push({ x: pts[i][0], y: pts[i][1], ang: heading(pts, i) + side * (0.7 + rnd() * 0.5),
        L: size * (0.32 + rnd() * 0.2), col: pick(LEAF), t0: t0 + dur * u, front: rnd() < 0.6 });
    }
    const end = pts[pts.length - 1], tEnd = t0 + dur * 0.85;
    if (tip === 'leaf') {
      leaves.push({ x: end[0], y: end[1], ang: heading(pts, pts.length - 1), L: size * 0.42, col: pick(LEAF), t0: tEnd, front: true });
    } else if (tip !== 'none') {
      const col = pick(PETALS);
      let col2 = pick(PETALS); if (col2 === col) col2 = PETALS[(PETALS.indexOf(col) + 1) % PETALS.length];
      flowers.push({ type: tip, x: end[0], y: end[1], R: size * (0.22 + rnd() * 0.14), rot: rnd() * Math.PI * 2,
        col, col2, t0: tEnd, front: true, sway: rnd() * 10 });    // blooms open above the name, in front of everything
    }
  }

  function grow(span) {
    const box = intro.getBoundingClientRect(), b = span.getBoundingClientRect();
    const h = b.height, w = b.width, x0 = b.left - box.left, top = b.top - box.top + h * 0.1;
    const now = performance.now(), lw = Math.max(1.6, h * 0.028);
    const flower = () => pick(['bloom', 'bloom', 'daisy', 'star', 'tulip', 'berry']);
    const inside = () => x0 + w * (0.2 + rnd() * 0.6);

    // one or two stems reaching up out of the letter
    const up = 1 + (rnd() < 0.55 ? 1 : 0);
    for (let i = 0; i < up; i++) {
      const pts = vine(inside(), top + h * (0.3 + rnd() * 0.25), -Math.PI / 2 + (rnd() - 0.5) * 0.7,
        h * (0.8 + rnd() * 0.55) * REACH, 0.35 + rnd() * 0.4, 1 + rnd() * 1.5, rnd() * 6);
      addStem(pts, lw, now + i * 140, 520 + rnd() * 260, rnd() < 0.85 ? flower() : 'leaf', h);
    }
    // sometimes a short one sneaks out sideways
    if (rnd() < 0.45) {
      const side = rnd() < 0.5 ? -1 : 1;
      let pts = vine(inside(), top + h * (0.4 + rnd() * 0.3), side < 0 ? Math.PI + 0.3 : -0.3,
        h * (0.3 + rnd() * 0.2), 0.5, 1.2, rnd() * 6);
      pts = curl(pts, side < 0 ? 1 : -1, h * 0.06);
      addStem(pts, lw * 0.8, now + 220, 480, rnd() < 0.5 ? 'none' : 'berry', h);
    }
    // a vine that arches over to the previous letter
    if (lastLetter && rnd() < 0.7) {
      const a = [inside(), top + h * (0.15 + rnd() * 0.3)];
      const pb = lastLetter.getBoundingClientRect();
      const bpt = [pb.left - box.left + pb.width * (0.3 + rnd() * 0.5), pb.top - box.top + h * (0.15 + rnd() * 0.3)];
      addStem(arch(a, bpt, h * (0.3 + rnd() * 0.35)), lw * 0.9, now + 90, 600, rnd() < 0.5 ? 'leaf' : 'none', h);
    }
    lastLetter = span;
    if (!raf) raf = requestAnimationFrame(frame);
  }

  /* ── Drawing ── */
  function smooth(g, pts, i0, i1) {
    g.beginPath();
    g.moveTo(pts[i0][0], pts[i0][1]);
    for (let i = i0 + 1; i < i1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    g.lineTo(pts[i1][0], pts[i1][1]);
    g.stroke();
  }

  function drawStem(s, now) {
    const p = easeOut((now - s.t0) / s.dur);
    if (p <= 0) return;
    const last = s.pts.length - 1, reach = p * last;
    for (const r of s.runs) {
      const i0 = Math.floor(r.a * last), i1 = Math.min(Math.ceil(r.b * last), Math.ceil(reach));
      if (i1 <= i0) continue;
      const g = r.front ? front : back;
      g.strokeStyle = STEM; g.lineWidth = s.w; g.lineCap = 'round'; g.lineJoin = 'round';
      smooth(g, s.pts, i0, i1);
    }
  }

  function drawLeaf(l, now) {
    const s = spring((now - l.t0) / 450);
    if (s <= 0) return;
    const g = l.front ? front : back, L = l.L * s, wd = L * 0.38;
    g.save(); g.translate(l.x, l.y); g.rotate(l.ang);
    g.beginPath(); g.moveTo(0, 0);
    g.quadraticCurveTo(L * 0.5, -wd, L, 0);
    g.quadraticCurveTo(L * 0.5, wd, 0, 0);
    g.fillStyle = l.col; g.fill();
    g.beginPath(); g.moveTo(L * 0.1, 0); g.lineTo(L * 0.8, 0);
    g.strokeStyle = VEIN; g.lineWidth = Math.max(1, L * 0.04); g.stroke();
    g.restore();
  }

  function petal(g, len, wid) {        // a rounded petal pointing along +x from the centre
    g.beginPath(); g.moveTo(0, 0);
    g.bezierCurveTo(len * 0.3, -wid, len, -wid * 0.8, len, 0);
    g.bezierCurveTo(len, wid * 0.8, len * 0.3, wid, 0, 0);
    g.fill();
  }

  function drawFlower(f, now) {
    const s = spring((now - f.t0) / 700);
    if (s <= 0) return;
    const g = f.front ? front : back, R = f.R * s;
    g.save(); g.translate(f.x, f.y); g.rotate(f.rot + Math.sin(now / 900 + f.sway) * 0.06);
    if (f.type === 'bloom') {                     // layered petals, darker inside
      for (let ring = 0; ring < 3; ring++) {
        const n = 5, rr = R * (1 - ring * 0.28);

                    doorway.classList.add("rattle");
                    errorEl.textContent = "That's not the password. Check the spelling; capitals count.";
                    input.select();
                    busy = false;
                    return;
                }

                if (!still) await walkIn();
                document.write(pendingPage);
                document.close();
            });
        </script>
    </body>
</html>
