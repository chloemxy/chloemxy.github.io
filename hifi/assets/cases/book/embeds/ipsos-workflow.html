<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#efe4d1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Libre+Caslon+Text&display=swap"
            rel="stylesheet"
        />
        <script>
          // On the way into hi-fi (the password page left a note): put its
          // picture of the doors up now, before the stylesheets and fonts below
          // can hold the first paint back, so they never vanish between pages.
          // Hi-fi's own page does the same, and takes them down once its 3D
          // doors are ready behind.
          (function () {
            try {
              if (!/\/hifi\//.test(location.pathname) || !localStorage.getItem("staticrypt_passphrase")) return;
              var held = sessionStorage.getItem("portfolio.enter");
              if (!held || held.charAt(0) !== "<") return;
              var hold = document.createElement("div");
              hold.id = "gate-hold";
              hold.style.cssText = "position:fixed;inset:0;z-index:700;pointer-events:none";
              hold.innerHTML = held;
              document.documentElement.appendChild(hold);
              document.documentElement.style.background = "#d8c3a2";
              // the top bar stays above them, whatever its page's own styles say
              var keep = document.createElement("style");
              keep.textContent = ".bar, .site-bar { z-index: 800 !important; }";
              document.head.appendChild(keep);
            } catch (e) {}
          })();
        </script>
        <link rel="stylesheet" href="/tokens.css?v=20261028032818" /><link rel="stylesheet" href="/bar.css?v=20261028032818" />

        <style>
            /* The way in: the hi-fi scene's stained glass doors (plywood leaves
               glazed with the illustration's three panels, floral sidelights), as
               its own camera shows them. As the page loads, each piece of glass
               lights up in colour; then the password, at the foot of the doors.
               The right one opens the site, whose doors slide apart onto the shelf
               wall. (The old dark intro
               is kept in archive/loading-dark.html.) */
            :root {
                --paper: #efe4d1;
                --ink: #2b231c;
                --body: rgba(43, 35, 28, 0.76);
                --mute: rgba(43, 35, 28, 0.6);
                --hair: rgba(43, 35, 28, 0.14);
                --border: rgba(43, 35, 28, 0.34);
                --error: #a3341f;
                --u: 48px;             /* one tile of the password field */
                --navy: #2f3b5c;       /* the painted signs' blue */
                --glaze-go: #c2683f;   /* the terracotta of the pots */

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;

                --text: "Archivo", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);

                --bar: 64px;
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--text);
                font-stretch: semi-condensed; /* as tokens.css --f-stretch; this page can't load tokens.css */
                -webkit-font-smoothing: antialiased;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }
            /* Moving between pages: the site's own top bar (bar.css) on the next
               page's background, so the bar holds still while the page unlocks */
            @view-transition { navigation: auto; }
            html.passing, html.passing body { background: var(--pass-bg); }

            /* Same bar as the hi-fi site: the name split across both ends */
            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 5;
                display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-3);
                padding: 0 var(--space-6);
                background: #fffdf9;
                border-bottom: 1px solid var(--hair);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .mark:last-child { justify-self: end; }
            .bar .label { font: 500 var(--text-xs)/1.4 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }

            .gate { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; background: #e9dcc4; }
            /* the doors, painted by the script (inline styles, so the hi-fi
               loading screen can wear them as they are) */
            .doors { position: fixed; inset: 0; z-index: 0; }
            .leaving .gate { background: transparent; }

            .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

            /* ---------- Loading, then the password, at the foot of the doors ---------- */
            .panel {
                position: fixed; z-index: 3; left: 50%; bottom: 36px;
                width: min(380px, calc(100vw - 32px)); transform: translateX(-50%);
                transition: opacity 400ms var(--out);
            }
            .panel .error { text-shadow: 0 0 12px rgba(255, 250, 240, 0.95), 0 0 2px rgba(255, 250, 240, 0.95); }
            .panel.shake { animation: shake 380ms var(--out); }
            @keyframes shake {
                0%, 100% { transform: translateX(-50%); }
                25% { transform: translateX(calc(-50% - 6px)); }
                50% { transform: translateX(calc(-50% + 5px)); }
                75% { transform: translateX(calc(-50% - 3px)); }
            }

            form {
                position: relative;
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready { opacity: 1; transform: none; }
            /* the field: a long tile of cream glaze to write on, then a tile to
               show the password and a painted tile to go in */
            .field {
                position: relative; display: grid; height: var(--u);
                grid-template-columns: minmax(0, 1fr) var(--u) var(--u); gap: 3px;
            }
            .field > * {
                min-width: 0; border: 0; border-radius: 2px;
                box-shadow: inset 0 0 0 1px rgba(255, 250, 240, 0.35), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 2px 10px rgba(40, 30, 20, 0.25);
            }
            .field input {
                padding: 0 var(--space-4); color: var(--navy);
                background:
                    linear-gradient(180deg, rgba(255, 253, 247, 0.75), rgba(255, 253, 247, 0) 55%),
                    #f6ebd8;
                font: 400 var(--text-md) var(--brand); letter-spacing: 0.12em;
            }
            .field input::placeholder { color: rgba(47, 59, 92, 0.55); letter-spacing: 0.04em; font-style: italic; }
            .field input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--navy), inset 0 -6px 10px rgba(80, 55, 25, 0.16), 0 2px 10px rgba(40, 30, 20, 0.25); }
            .field button {
                display: grid; place-items: center; padding: 0; cursor: pointer;
                transition: filter 200ms var(--out);
            }
            .field button svg { width: 22px; height: 22px; pointer-events: none; }
            .field button:hover { filter: brightness(1.06); }
            .field button:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
            .eye {
                color: var(--navy);
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.7), rgba(255, 253, 247, 0) 70%), #f8eedd;
            }
            .eye[aria-pressed="true"] { background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 253, 247, 0.6), rgba(255, 253, 247, 0) 70%), #e6d4b6; }
            .enter {
                color: #fbf3e4;
                background: radial-gradient(ellipse 70% 45% at 30% 22%, rgba(255, 236, 210, 0.45), rgba(255, 236, 210, 0) 70%), var(--glaze-go);
            }
            .error { position: absolute; left: 0; right: 0; top: calc(100% + 6px); min-height: 18px; margin: 0; text-align: center; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.02em; }

            /* On the way in, the password steps aside and the doors open */
            .leaving .panel, .panel.checking { opacity: 0; pointer-events: none; }
            .panel.checking { transition-duration: 220ms; }
            .veil { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 380ms ease; }
            .veil.on { opacity: 1; }

            @media (max-width: 899px) {
                :root { --bar: 56px; }
                .bar { padding: 0 var(--space-4); }
                .bar .mark { font-size: 20px; }
                .panel { bottom: 28px; }
            }
            @media (prefers-reduced-motion: reduce) {
                .panel.shake { animation: none; }
                form { transition: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"></div>
        <script>
          (function () {
            // The site's own top bar (bar.css), drawn here for a page that's
            // still unlocking: also used by the way in below, on its way to hi-fi
            window.gateSiteBar = function (fi, hifiPage) {
              var icon = hifiPage
                ? '<span class="site-bar__icon" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h3l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18.3 6.6a8 8 0 0 1 0 10.8"/></svg></span>'
                : '<span class="site-bar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg></span>';
              // (a working bar: whichever copy is showing at a given moment,
              // its switch goes where it says)
              var bar = document.createElement("header");
              bar.className = "site-bar";
              bar.innerHTML = '<a class="site-bar__mark" href="/index.html">CHLOE</a><div class="site-bar__tools"><nav class="site-bar__switch" aria-label="Site version">'
                + '<a href="/index.html"' + (fi === "lofi" ? ' aria-current="page"' : '') + '>Lo-fi</a><a href="/hifi/"' + (fi === "hifi" ? ' aria-current="page"' : '') + '>Hi-fi</a>'
                + '</nav>' + icon + '</div><span class="site-bar__mark site-bar__mark--end" aria-hidden="true">MA</span>';
              return bar;
            };
            // Someone who's already in is only moving between pages: show the
            // bar the next page has, with its switch already set.
            try { if (!localStorage.getItem("staticrypt_passphrase")) return; } catch (e) { return; }
            var path = location.pathname, fi;
            if (/\/hifi\//.test(path)) fi = "hifi";
            else if (/\/(index\.html)?$/.test(path)) fi = "lofi";
            else { try { fi = localStorage.getItem("portfolio.fi") === "hifi" ? "hifi" : "lofi"; } catch (e) { fi = "lofi"; } }
            var hifiPage = fi === "hifi" && /\/hifi\//.test(path);
            var bar = window.gateSiteBar(fi, hifiPage);
            bar.id = "passing-bar";
            document.body.appendChild(bar);
            var root = document.documentElement;
            // (just in from the password page, the doors are already up: see the head)
            var held = document.getElementById("gate-hold");
            root.style.setProperty("--pass-bg", held ? "#d8c3a2" : hifiPage ? "#ffffff" : "var(--c-warm, #EDEAE5)");
            root.classList.add("passing");
          })();
        </script>

            <header class="bar">

            <main class="gate" id="gate">

                <h1 class="sr-only">Chloe Ma</h1>

                            <button type="submit" class="enter" aria-label="Enter" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
                        </div>

            </main>
            <div class="veil" id="veil"></div>

                    return `<div class="gd-${name}" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${pic(x, y)};will-change:transform"></div>`;
                };
                // how far each part travels to clear the screen, for hi-fi's opening
                const seam = X(PARTS.mid[1]), midW = seam - X(PARTS.mid[0]);
                return `<div class="gate-backdrop" data-dl="${seam + 40}" data-dr="${W - seam + 40}" data-mw="${midW}" data-hh="${Y(PARTS.head[2]) + 40}" `
                    + `style="position:absolute;left:0;top:0;width:${W}px;height:${H}px;overflow:hidden;pointer-events:none;background:#d8c3a2">`
                    + `<div class="gd-still" style="position:absolute;left:${left}px;top:${top}px;width:${pw}px;height:${ph}px;${pic(left, top)}"></div>`
                    + part("mid", PARTS.mid) + part("left", PARTS.left) + part("right", PARTS.right) + part("head", PARTS.head) + `</div>`;
            }

            // The clear glass over the colour, piece by piece: where a piece's
            // moment has come, the clear layer goes and its colour shows
            function makeCover() {
                const c = document.createElement("canvas");
                c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none";
                const g = c.getContext("webgl", { premultipliedAlpha: true, antialias: false });
                if (!g) return null;
                const sh = (type, src) => { const o = g.createShader(type); g.shaderSource(o, src); g.compileShader(o); return o; };
                const prog = g.createProgram();
                g.attachShader(prog, sh(g.VERTEX_SHADER,
                    "attribute vec2 a; uniform vec4 r; varying vec2 v;" +
                    "void main(){ v = a; vec2 p = r.xy + a * r.zw; gl_Position = vec4(p.x * 2.0 - 1.0, 1.0 - p.y * 2.0, 0.0, 1.0); }"));
                g.attachShader(prog, sh(g.FRAGMENT_SHADER,
                    "precision mediump float; varying vec2 v; uniform sampler2D col, ord; uniform float p;" +
                    "void main(){ vec3 c = texture2D(col, v).rgb; float o = texture2D(ord, v).r;" +
                    // clear glass: the colour taken out, a faint warmth left, a little paler
                    " float l = dot(c, vec3(0.3, 0.59, 0.11)); vec3 cl = vec3(l * 1.02, l * 0.98, l * 0.9);" +
                    " cl = (cl - 0.5) * 0.82 + 0.56;" +
                    // the wood and frame (0 in the map) are never glass: always in colour
                    " float a = o < 0.02 ? 0.0 : 1.0 - smoothstep(o, o + 0.04, p);" +
                    " gl_FragColor = vec4(cl * a, a); }"));
                g.linkProgram(prog);
                if (!g.getProgramParameter(prog, g.LINK_STATUS)) return null;
                g.useProgram(prog);
                const buf = g.createBuffer();
                g.bindBuffer(g.ARRAY_BUFFER, buf);
                g.bufferData(g.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), g.STATIC_DRAW);
                const at = g.getAttribLocation(prog, "a");
                g.enableVertexAttribArray(at);
                g.vertexAttribPointer(at, 2, g.FLOAT, false, 0, 0);
                const tex = (img, unit, nearest) => {
                    const t = g.createTexture();
                    g.activeTexture(g.TEXTURE0 + unit);
                    g.bindTexture(g.TEXTURE_2D, t);
                    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, g.RGBA, g.UNSIGNED_BYTE, img);
                    const f = nearest ? g.NEAREST : g.LINEAR;
                    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, f);
                    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, f);
                    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
                    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
                };
                tex(doorsImg, 0, false); tex(orderImg, 1, true);
                g.uniform1i(g.getUniformLocation(prog, "col"), 0);
                g.uniform1i(g.getUniformLocation(prog, "ord"), 1);
                return { c, g, r: g.getUniformLocation(prog, "r"), p: g.getUniformLocation(prog, "p") };
            }
            function drawCover() {
                if (!cover) return;
                const { c, g } = cover, { W, H, left, top, pw, ph } = layout(), k = Math.min(window.devicePixelRatio || 1, 2);
                if (c.width !== Math.round(W * k) || c.height !== Math.round(H * k)) { c.width = Math.round(W * k); c.height = Math.round(H * k); }
                g.viewport(0, 0, c.width, c.height);
                g.clearColor(0, 0, 0, 0); g.clear(g.COLOR_BUFFER_BIT);
                g.uniform4f(cover.r, left / W, top / H, pw / W, ph / H);
                g.uniform1f(cover.p, fill * 1.06);
                g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
            }
            function hangDoors() {
                doors.innerHTML = doorsHTML();
                if (cover && fill < 1) { doors.appendChild(cover.c); drawCover(); }
            }
            function setFill(p) {
                fill = p;
                drawCover();
                if (p >= 1 && cover) { cover.c.remove(); cover = null; }   // all in colour: the picture alone from here
            }
            let resizing = 0;
            addEventListener("resize", () => {
                clearTimeout(resizing);
                resizing = setTimeout(() => { if (doorsImg && !document.body.classList.contains("leaving")) hangDoors(); }, 150);
            });

            // Loading: first the doors' picture and its pieces' map (to have
            // something to light), then the glass lights up exactly as fast as the
            // hi-fi site behind it arrives: its page, three.js, the doors' glass
            // and the wall's wood are fetched here (into the browser's cache, so
            // going in doesn't wait for them), and each piece of glass glows as
            // their bytes come in. Any other page has nothing more to fetch.
            const HOME = /\/(index\.html)?$/.test(location.pathname);
            function fetchSite() {
                let fonts = 0;
                (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fonts = 1; });
                if (!HOME) return () => fonts;
                // every file the scene loads, with its size (hifi/preload.json, written by build.sh)
                const base = location.pathname.replace(/index\.html$/, "") + "hifi/";
                let list = null, got = [], done = [];
                fetch(base + "preload.json").then((r) => r.json()).then((files) => {
                    list = [[base, 30000], ...files.map(([u, n]) => [/^https?:/.test(u) ? u : base + u, n])];
                    got = list.map(() => 0); done = list.map(() => false);
                    list.forEach(async ([url], i) => {
                        try {
                            const res = await fetch(url, { mode: /^https?:/.test(url) ? "cors" : "same-origin" });
                            const reader = res.body.getReader();
                            for (;;) { const { done: end, value } = await reader.read(); if (end) break; got[i] += value.length; }
                        } catch (e) {}
                        done[i] = true;
                    });
                }).catch(() => { list = []; });
                return () => {
                    if (!list) return 0;
                    if (!list.length) return fonts;
                    let have = 0, all = 0;
                    list.forEach(([, n], i) => { all += n; have += done[i] ? n : Math.min(got[i], n); });
                    return (have / all) * 0.98 + fonts * 0.02;
                };
            }
            /* ---------- The stage: hi-fi itself, built behind the doors ---------- */
            // On the homepage the whole hi-fi scene starts now, before the
            // password, in hifi/stage.html (an open copy of the hi-fi page): its
            // 3D doors closed, its glass lighting up piece by piece as it loads.
            // This picture of the doors stands in until the stage draws (same
            // camera, same render), then steps aside; the password appears once
            // the stage is built, and opens its doors. If the stage can't start
            // (no WebGL, or nothing heard for a while), `fallback` takes over: the
            // picture, and the way in through the hi-fi page.
            let stage = null;
            function openStage(fallback) {
                const frame = document.createElement("iframe");
                frame.id = "stage";
                frame.title = "Chloe Ma, hi-fi portfolio";
                frame.setAttribute("aria-hidden", "true");
                frame.tabIndex = -1;
                frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;pointer-events:none;background:#d8c3a2";
                frame.src = location.pathname.replace(/index\.html$/, "") + "hifi/stage.html";
                doors.before(frame);
                stage = { frame, p: 0, ready: false, failed: false, opened: null };
                let heard = false;
                addEventListener("message", (e) => {
                    if (e.origin !== location.origin || e.source !== frame.contentWindow || !e.data?.stage) return;
                    heard = true;
                    const m = e.data;
                    if (m.stage === "progress") stage.p = m.p;
                    else if (m.stage === "drawn") { doors.style.transition = "opacity 500ms ease"; doors.style.opacity = "0"; }
                    else if (m.stage === "ready") stage.ready = true;
                    else if (m.stage === "opened") stage.opened?.();
                });
                setTimeout(() => {
                    if (heard) return;
                    stage.failed = true; frame.remove(); stage = null; doors.style.opacity = "";
                    fallback();
                }, 15000);
                return () => (stage ? (stage.ready ? 1 : Math.min(0.99, stage.p)) : 0);
            }

            function load() {
                return new Promise((resolve) => {
                    let shown = 0, last = 0, progress = () => 1, waiting = 2;
                    const pics = {};
                    const tick = (now) => {
                        const dt = last ? (now - last) / 1000 : 0;
                        last = now;
                        const target = Math.min(1, progress());
                        shown += (target - shown) * (still ? 1 : 1 - Math.exp(-dt * 6));
                        if (target >= 1 && shown > 0.995) shown = 1;
                        setFill(shown);
                        doors.setAttribute("aria-valuenow", String(Math.round(shown * 100)));
                        if (shown >= 1) return resolve();
                        requestAnimationFrame(tick);
                    };
                    const begin = () => {
                        doorsImg = pics.doors || true; orderImg = pics.order || null;
                        if (pics.doors && pics.order) { try { cover = makeCover(); } catch (e) { cover = null; } }
                        hangDoors();
                        progress = HOME ? openStage(() => { progress = fetchSite(); }) : fetchSite();
                        requestAnimationFrame(tick);
                    };
                    for (const [key, src] of [["doors", DOORS], ["order", ORDER]]) {
                        const img = new Image();
                        img.onload = () => { pics[key] = img; if (--waiting === 0) begin(); };
                        img.onerror = () => { if (--waiting === 0) begin(); };
                        img.src = src;
                    }
                });
            }

            function showPassword() {
                doors.removeAttribute("role");
                form.removeAttribute("aria-hidden");
                form.querySelectorAll("[tabindex='-1']").forEach((el) => el.removeAttribute("tabindex"));
                form.classList.add("ready");
                input.focus({ preventScroll: true });
            }

            /* ---------- Going in ---------- */
            // The homepage (index.html carries the marker) always opens on the
            // hi-fi site from here; the switch in its bar leads back to lo-fi.
            function toHifi(html) { return html.includes("/*hifi-first*/"); }
            // The colour the next page opens on, so the last moment fades into it
            function pageColour(html) {
                const m = html.match(/body\s*\{[^}]*?background(?:-color)?\s*:\s*(#[0-9a-f]{3,8})/i);
                return m ? m[1] : "#ffffff";
            }

            input.addEventListener("input", () => { errorEl.textContent = ""; });

            eye.addEventListener("click", () => {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
                eye.setAttribute("aria-pressed", String(show));
                input.focus();
            });

            panel.addEventListener("animationend", () => panel.classList.remove("shake"));

            // Moving between pages (a remembered password): the sheet shows the
            // site's bar (see the script above) until the page unlocks.
            const opening = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    // the remembered password had run out: back to the way in
                    document.documentElement.classList.remove("passing");
                    $("passing-bar")?.remove();
                    $("staticrypt_loading").classList.add("hidden");
                    $("staticrypt_content").classList.remove("hidden");
                    await load();
                    await wait(still ? 0 : 250);
                    showPassword();
                }
            };
            // (not any sooner: written before load, the page comes out cut short)
            window.onload = opening;

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                if (busy || !form.classList.contains("ready")) return;

                const password = input.value;
                if (!password) {
                    errorEl.textContent = "Type the password first.";
                    input.focus();
                    return;
                }

                busy = true;
                holdPage = true;
                // answer at once: the field steps back while the password is
                // checked (that check is slow on purpose; it's what keeps the site locked)
                panel.classList.add("checking");
                await wait(40);   // a moment for the fade to begin before the slow check holds the page
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember.checked);

                if (!isSuccessful) {
                    holdPage = false;
                    panel.classList.remove("checking");
                    panel.classList.add("shake");
                    errorEl.textContent = "That's not the password. Check the spelling; capitals count.";
                    input.select();
                    busy = false;
                    return;
                }

                document.documentElement.style.overflow = "hidden";
                document.body.classList.add("leaving");
                if (stage?.ready && toHifi(pendingPage)) {
                    // The stage is hi-fi, already built behind the doors: they open
                    // in place, its own top bar takes over, and the address becomes
                    // the hi-fi page's.
                    const siteBar = window.gateSiteBar("hifi", true);
                    document.querySelector(".bar").replaceWith(siteBar);
                    stage.opened = () => {
                        siteBar.remove();
                        stage.frame.style.pointerEvents = "auto";
                        stage.frame.removeAttribute("aria-hidden");
                        stage.frame.tabIndex = 0;
                        stage.frame.focus();
                        $("panel")?.remove();
                        const hifi = location.pathname.replace(/index\.html$/, "") + "hifi/";
                        try { history.replaceState(null, "", hifi); localStorage.setItem("portfolio.fi", "hifi"); } catch (e) {}
                        document.title = "Chloe Ma · Hi-fi portfolio";
                    };
                    stage.frame.contentWindow.postMessage({ stage: "open" }, location.origin);
                    // (if the doors haven't said they're open well after their slide, go in the usual way)
                    setTimeout(() => { if (stage.frame.style.pointerEvents !== "auto") location.replace("hifi/"); }, 6000);
                    return;
                }
                if (toHifi(pendingPage)) {
                    // Hi-fi opens behind these same closed doors (its loading
                    // screen wears this picture of them until its own 3D doors are
                    // ready, then they slide apart onto the shelf wall). The top
                    // bar turns into the site's own.
                    // the doors go with a copy of the site's top bar, styled inline,
                    // inside the same overlay: the bar is anchored above them at
                    // every moment, on every page they're shown on
                    const siteBar = window.gateSiteBar("hifi", true);
                    document.querySelector(".bar").replaceWith(siteBar);
                    const barCopy = frozen(siteBar);
                    barCopy.removeAttribute("id"); barCopy.style.zIndex = "2";
                    try { sessionStorage.setItem("portfolio.enter", doorsHTML() + barCopy.outerHTML); } catch (e) {}
                    return location.replace("hifi/");
                }
                // any other page: a fade into the page's own colour
                if (!still) {
                    veil.style.background = pageColour(pendingPage);
                    veil.classList.add("on");
                    await wait(400);
                }
                document.write(carryBar(pendingPage));
                document.close();
            });
          })();
        </script>
    </body>
</html>
