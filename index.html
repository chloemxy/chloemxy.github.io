<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Chloe Ma — Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#161412" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Libre+Caslon+Text&display=swap"
            rel="stylesheet"
        />

        <style>
            /* The way in, on the dark sheet the lo-fi intro used to play on:
               stars, the illustration filling in as the page loads, and CHLOE MA
               flipping into place with flowers growing out of it. Then the
               password; the right one moves the view into the illustration and
               on to the site. (The intro on its own is kept in archive/loading-dark.html.) */
            :root {
                --paper: #161412;
                --ink: #ffffff;
                --body: rgba(255, 255, 255, 0.72);
                --mute: rgba(255, 255, 255, 0.6);
                --hair: rgba(255, 255, 255, 0.14);
                --border: rgba(255, 255, 255, 0.34);
                --slot: rgba(255, 255, 255, 0.08);
                --error: #ff9b85;

                --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
                --space-5: 24px; --space-6: 32px; --space-7: 48px;
                --text-xs: 12px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px;
                --control: 48px;

                --text: "Inter", -apple-system, Helvetica, Arial, sans-serif;
                --brand: "Libre Caslon Text", Georgia, serif;
                --out: cubic-bezier(0.16, 1, 0.3, 1);
                --push: cubic-bezier(0.62, 0, 0.25, 1);

                --bar: 64px;
                /* wide enough for CHLOE MA on one line beside the password column */
                --name-size: clamp(56px, min(9vw, calc((82vw - 384px) / 5.4)), 140px);
            }

            * { box-sizing: border-box; }
            .hidden { display: none !important; }
            html, body { margin: 0; background: var(--paper); }
            body {
                color: var(--ink);
                font: 400 var(--text-sm)/1.5 var(--text);
                -webkit-font-smoothing: antialiased;
            }
            .label {
                font: 500 var(--text-xs)/1.4 var(--text);
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

            /* A blank sheet while a remembered password unlocks the page */
            .staticrypt-spinner-container { min-height: 100vh; min-height: 100svh; }

            /* Same bar as the hi-fi site: the name split across both ends */
            .bar {
                position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 5;
                display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-3);
                padding: 0 var(--space-6);
                background: var(--paper);
                border-bottom: 1px solid var(--hair);
                transition: opacity 400ms var(--out);
            }
            .bar .mark { font: 400 24px/1 var(--brand); letter-spacing: 0.01em; }
            .bar .mark:last-child { justify-self: end; }
            .bar .label { color: var(--mute); }

            .gate {
                position: relative; overflow: hidden;
                min-height: 100vh; min-height: 100svh;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 320px;
                grid-template-rows: minmax(0, 1fr) auto;
                column-gap: 64px; row-gap: var(--space-5);
                padding: calc(var(--bar) + var(--space-5)) 9vw calc(10vh + 24px);
            }
            .gate > canvas { transition: opacity 500ms var(--out); }

            /* ---------- Stars ---------- */
            .spark { position: absolute; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 500ms var(--out); }
            .spark.on { animation: starAppear var(--d, 500ms) cubic-bezier(0.22, 1, 0.36, 1) forwards; }
            .spark.pop { z-index: 3; animation: sparkPop 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
            @keyframes starAppear {
                0%   { opacity: 0;    transform: scale(0.2)  rotate(-16deg); }
                55%  { opacity: 1;    transform: scale(1.09) rotate(5deg); }
                78%  { opacity: 0.88; transform: scale(0.96) rotate(1deg); }
                100% { opacity: 0.9;  transform: scale(1)    rotate(2deg); }
            }
            @keyframes sparkPop {
                0%   { opacity: 0; transform: scale(0.2) rotate(-18deg); }
                30%  { opacity: 1; transform: scale(1.08) rotate(4deg); }
                60%  { opacity: 0.7; transform: scale(0.95) rotate(1deg); }
                100% { opacity: 0; transform: scale(0.55) rotate(10deg); }
            }

            /* ---------- The illustration, filling in as the page loads ---------- */
            .art { grid-column: 1; grid-row: 1; position: relative; z-index: 1; min-height: 0; display: grid; place-items: center; }
            .illus {
                display: block; height: auto;
                /* as big as the space above the name allows (the picture is 959 x 726) */
                width: min(100%, 640px, calc((100svh - var(--bar) - 10vh - 72px - var(--name-size) * 0.9) * 1.321));
                border-radius: 14px;
                box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
                clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
                transition: transform 1600ms var(--push), border-radius 1600ms var(--push);
            }

            /* ---------- The name ---------- */
            .name {
                grid-column: 1; grid-row: 2; align-self: end;
                position: relative; z-index: 1;
                display: flex; flex-wrap: nowrap; white-space: nowrap; align-items: flex-end; margin: 0;
                font: 700 var(--name-size)/0.9 var(--text);
                letter-spacing: -0.045em; text-transform: uppercase;
                transition: opacity 500ms var(--out);
            }
            .name .l { display: inline-block; color: rgba(255, 255, 255, 0.28); transition: color 120ms ease; }
            .name .l.in { color: #fff; }
            .name .sp { display: inline-block; width: 0.28em; }

            .foot {
                position: absolute; bottom: 40px; left: 48px; right: 48px; z-index: 1;
                display: flex; justify-content: space-between; align-items: flex-end;
                font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
                color: rgba(255, 255, 255, 0.65);
                transition: opacity 400ms var(--out);
            }

            /* ---------- Loading, then the password ---------- */
            .panel { grid-column: 2; grid-row: 1 / 3; align-self: end; position: relative; z-index: 3; width: 100%; transition: opacity 400ms var(--out); }
            .panel.shake { animation: shake 380ms var(--out); }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-3px); }
            }
            .loader-line {
                display: flex; gap: var(--space-3); align-items: baseline; margin: 0 0 var(--space-5);
                font: 500 var(--text-lg)/1.2 var(--text);
            }
            .loader-pct { min-width: 4ch; color: var(--mute); font-variant-numeric: tabular-nums; font-size: var(--text-sm); }

            form {
                opacity: 0; transform: translateY(8px);
                transition: opacity 500ms var(--out), transform 500ms var(--out);
            }
            form.ready { opacity: 1; transform: none; }
            .lede { margin: 0 0 var(--space-4); color: var(--body); }
            .field-label { display: block; margin-bottom: var(--space-2); color: var(--mute); }
            .field { display: flex; }
            .field input {
                flex: 1; min-width: 0; height: var(--control);
                padding: 0 var(--space-4);
                border: 1px solid var(--border); border-right: 0; border-radius: 0;
                background: transparent; color: var(--ink);
                font: 400 var(--text-md) var(--text); letter-spacing: 0.08em;
            }
            .field input:focus { outline: none; border-color: var(--ink); }
            .field input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
            .eye {
                flex: none; height: var(--control); padding: 0 var(--space-4);
                border: 1px solid var(--border); border-radius: 0;
                background: transparent; color: var(--ink); cursor: pointer;
            }
            .eye:hover { background: var(--slot); }
            .error { min-height: 20px; margin: var(--space-2) 0 0; font-size: var(--text-xs); color: var(--error); letter-spacing: 0.02em; }
            .remember {
                display: inline-flex; align-items: center; gap: var(--space-2);
                min-height: 44px; color: var(--body); cursor: pointer;
            }
            .remember input { width: 16px; height: 16px; margin: 0; accent-color: #fff; cursor: pointer; }
            .enter {
                display: block; width: 100%; height: var(--control); margin-top: var(--space-2);
                border: 1px solid var(--ink); border-radius: 0;
                background: var(--ink); color: var(--paper); cursor: pointer;
                transition: background 200ms var(--out), color 200ms var(--out);
            }
            .enter:hover { background: transparent; color: var(--ink); }
            .help { margin: var(--space-5) 0 0; padding-top: var(--space-4); border-top: 1px solid var(--hair); color: var(--mute); }
            .help a { color: var(--ink); text-underline-offset: 3px; }

            /* On the way in: everything but the illustration steps aside */
            .leaving .bar, .leaving .panel, .leaving .name, .leaving .foot, .leaving .spark, .leaving .gate > canvas { opacity: 0; }
            .leaving .spark { animation: none; }
            .veil { position: fixed; inset: 0; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 380ms ease; }
            .veil.on { opacity: 1; }

            @media (max-width: 899px) {
                :root { --bar: 56px; --name-size: clamp(44px, 13vw, 96px); }
                .bar { padding: 0 var(--space-4); }
                .bar .mark { font-size: 20px; }
                .gate {
                    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto;
                    padding: calc(var(--bar) + var(--space-5)) var(--space-4) var(--space-6);
                }
                .art, .name, .panel { grid-column: 1; grid-row: auto; }
                .illus { width: 100%; max-width: 520px; }
                .panel { max-width: 400px; margin-top: var(--space-3); }
                .foot { position: static; z-index: 1; margin-top: var(--space-6); }
            }
            @media (prefers-reduced-motion: reduce) {
                .panel.shake, .spark.on { animation: none; }
                .spark { opacity: 0.9; }
                form, .name .l, .illus { transition: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container"></div>

        <div id="staticrypt_content" class="hidden">
            <header class="bar">
                <span class="mark" aria-hidden="true">CHLOE</span>
                <span class="label">By invitation</span>
                <span class="mark" aria-hidden="true">MA</span>
            </header>

            <main class="gate" id="gate">
                <div class="art">
                    <img class="illus" id="illus" alt="" role="progressbar" aria-label="Opening up" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" />
                </div>

                <h1 class="name" id="name" aria-label="Chloe Ma"></h1>

                <div class="panel" id="panel">
                    <p class="loader-line"><span class="loader-text" id="loader-text">Opening up</span><span class="loader-pct" id="loader-pct">0%</span></p>

                    <form id="staticrypt-form" action="#" method="post" novalidate aria-hidden="true">
                        <p class="lede">This portfolio is shared by invitation. Enter the password you were given.</p>
                        <label class="field-label label" for="staticrypt-password">Password</label>
                        <div class="field">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                aria-describedby="gate-error"
                                autocomplete="current-password"
                                autocapitalize="off"
                                spellcheck="false"
                                tabindex="-1"
                            />
                            <button type="button" class="eye label" id="eye" aria-pressed="false" tabindex="-1">Show</button>
                        </div>

                        <p class="error" id="gate-error" role="status" aria-live="polite"></p>

                        <label id="staticrypt-remember-label" class="remember hidden">
                            <input id="staticrypt-remember" type="checkbox" name="remember" checked tabindex="-1" />
                            Remember me on this device
                        </label>

                        <button type="submit" class="enter label" tabindex="-1">Come in</button>

                        <p class="help">No password? Ask <a href="mailto:chloexy.ma@gmail.com" tabindex="-1">chloexy.ma@gmail.com</a></p>
                    </form>
                </div>

                <div class="foot" aria-hidden="true"><span>©2026</span><span>/Designing since 2018</span></div>
            </main>
            <div class="veil" id="veil"></div>
        </div>

        <script>
/* ══════════════════════════════════
   INTRO GARDEN — vines and flowers grow out of each letter of the name as it
   lands. Everything is drawn from code on two canvases, one behind the letters
   and one in front, so a stem can pass behind a letter and come out over it.
   Usage: const garden = introGarden(introEl); garden.grow(letterSpan);
   Options: introGarden(el, { petals: [...], stem, leaves: [...], centre, reach })
   (reach lengthens the upward stems, so blooms clear smaller lettering)
══════════════════════════════════ */
window.introGarden = function (intro, colours = {}) {
  const quiet = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (quiet || !intro) return { grow() {}, remaining() { return 0; } };

  const PETALS = colours.petals || ['#9b8cf8', '#f97316', '#06b6d4', '#ffffff', '#c4b5fd'];
  const STEM = colours.stem || '#84cc16', LEAF = colours.leaves || ['#84cc16', '#65a30d'];
  const CENTRE = colours.centre || '#161412', VEIN = 'rgba(22,20,18,0.45)', REACH = colours.reach || 1;

  /* Two layers: back sits under the name (z 0), front over it (z 2) */
  function layer(z) {
    const c = document.createElement('canvas');
    c.setAttribute('aria-hidden', 'true');
    c.style.cssText = `position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:${z}`;
    intro.appendChild(c);
    return c.getContext('2d');
  }
  const back = layer(0), front = layer(2);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit() {
    for (const g of [back, front]) {
      g.canvas.width = intro.clientWidth * dpr;
      g.canvas.height = intro.clientHeight * dpr;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }
  fit();
  window.addEventListener('resize', fit);

  /* ── Helpers ── */
  let seed = (Math.random() * 1e9) | 0;            // a different garden on every replay
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
  const pick = a => a[Math.floor(rnd() * a.length)];
  const easeOut = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const spring = t => t <= 0 ? 0 : t >= 1.6 ? 1 : 1 - Math.exp(-5 * t) * Math.cos(11 * t);  // overshoots, then settles

  /* A wandering stem: walk forward in small steps while the heading sways */
  function vine(x, y, dir, len, sway, waves, phase, n = 30) {
    const pts = [[x, y]], step = len / n;
    for (let i = 1; i <= n; i++) {
      const u = i / n, a = dir + sway * Math.sin(u * Math.PI * waves + phase) * Math.min(1, u * 2.5);
      x += Math.cos(a) * step; y += Math.sin(a) * step;
      pts.push([x, y]);
    }
    return pts;
  }
  /* An arching stem from one point to another, lifted by `lift` */
  function arch(a, b, lift, n = 30) {
    const c = [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - lift], pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]);
    }
    return pts;
  }
  /* Finish a stem in a little spiral */
  function curl(pts, side, r) {
    const [x, y] = pts[pts.length - 1], [px, py] = pts[pts.length - 2];
    const a = Math.atan2(y - py, x - px), cx = x - Math.sin(a) * side * r, cy = y + Math.cos(a) * side * r;
    const a0 = Math.atan2(y - cy, x - cx);
    for (let i = 1; i <= 16; i++) {
      const u = i / 16, t = a0 + side * u * Math.PI * 1.7, rr = r * (1 - 0.55 * u);
      pts.push([cx + Math.cos(t) * rr, cy + Math.sin(t) * rr]);
    }
    return pts;
  }
  const heading = (pts, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  };

  /* ── Garden state ── */
  const stems = [], leaves = [], flowers = [];
  let lastLetter = null, raf = 0;

  /* Split a stem into stretches that alternate behind and in front of the letters.
     It always starts behind, so it looks like it grows out of the letter. */
  function weave() {
    const cuts = [0];
    let u = 0.18 + rnd() * 0.25;
    while (u < 0.9) { cuts.push(u); u += 0.25 + rnd() * 0.35; }
    cuts.push(1);
    return cuts.slice(1).map((b, i) => ({ a: cuts[i], b, front: i % 2 === 1 }));
  }

  function addStem(pts, w, t0, dur, tip, size) {
    stems.push({ pts, w, t0, dur, runs: weave() });
    // leaves along the way, appearing as the stem reaches them
    const n = Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const u = 0.25 + rnd() * 0.55, i = Math.round(u * (pts.length - 1));
      const side = rnd() < 0.5 ? -1 : 1;
      leaves.push({ x: pts[i][0], y: pts[i][1], ang: heading(pts, i) + side * (0.7 + rnd() * 0.5),
        L: size * (0.32 + rnd() * 0.2), col: pick(LEAF), t0: t0 + dur * u, front: rnd() < 0.6 });
    }
    const end = pts[pts.length - 1], tEnd = t0 + dur * 0.85;
    if (tip === 'leaf') {
      leaves.push({ x: end[0], y: end[1], ang: heading(pts, pts.length - 1), L: size * 0.42, col: pick(LEAF), t0: tEnd, front: true });
    } else if (tip !== 'none') {
      const col = pick(PETALS);
      let col2 = pick(PETALS); if (col2 === col) col2 = PETALS[(PETALS.indexOf(col) + 1) % PETALS.length];
      flowers.push({ type: tip, x: end[0], y: end[1], R: size * (0.22 + rnd() * 0.14), rot: rnd() * Math.PI * 2,
        col, col2, t0: tEnd, front: true, sway: rnd() * 10 });    // blooms open above the name, in front of everything
    }
  }

  function grow(span) {
    const box = intro.getBoundingClientRect(), b = span.getBoundingClientRect();
    const h = b.height, w = b.width, x0 = b.left - box.left, top = b.top - box.top + h * 0.1;
    const now = performance.now(), lw = Math.max(1.6, h * 0.028);
    const flower = () => pick(['bloom', 'bloom', 'daisy', 'star', 'tulip', 'berry']);
    const inside = () => x0 + w * (0.2 + rnd() * 0.6);

    // one or two stems reaching up out of the letter
    const up = 1 + (rnd() < 0.55 ? 1 : 0);
    for (let i = 0; i < up; i++) {
      const pts = vine(inside(), top + h * (0.3 + rnd() * 0.25), -Math.PI / 2 + (rnd() - 0.5) * 0.7,
        h * (0.8 + rnd() * 0.55) * REACH, 0.35 + rnd() * 0.4, 1 + rnd() * 1.5, rnd() * 6);
      addStem(pts, lw, now + i * 140, 520 + rnd() * 260, rnd() < 0.85 ? flower() : 'leaf', h);
    }
    // sometimes a short one sneaks out sideways
    if (rnd() < 0.45) {
      const side = rnd() < 0.5 ? -1 : 1;
      let pts = vine(inside(), top + h * (0.4 + rnd() * 0.3), side < 0 ? Math.PI + 0.3 : -0.3,
        h * (0.3 + rnd() * 0.2), 0.5, 1.2, rnd() * 6);
      pts = curl(pts, side < 0 ? 1 : -1, h * 0.06);
      addStem(pts, lw * 0.8, now + 220, 480, rnd() < 0.5 ? 'none' : 'berry', h);
    }
    // a vine that arches over to the previous letter
    if (lastLetter && rnd() < 0.7) {
      const a = [inside(), top + h * (0.15 + rnd() * 0.3)];
      const pb = lastLetter.getBoundingClientRect();
      const bpt = [pb.left - box.left + pb.width * (0.3 + rnd() * 0.5), pb.top - box.top + h * (0.15 + rnd() * 0.3)];
      addStem(arch(a, bpt, h * (0.3 + rnd() * 0.35)), lw * 0.9, now + 90, 600, rnd() < 0.5 ? 'leaf' : 'none', h);
    }
    lastLetter = span;
    if (!raf) raf = requestAnimationFrame(frame);
  }

  /* ── Drawing ── */
  function smooth(g, pts, i0, i1) {
    g.beginPath();
    g.moveTo(pts[i0][0], pts[i0][1]);
    for (let i = i0 + 1; i < i1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    g.lineTo(pts[i1][0], pts[i1][1]);
    g.stroke();
  }

  function drawStem(s, now) {
    const p = easeOut((now - s.t0) / s.dur);
    if (p <= 0) return;
    const last = s.pts.length - 1, reach = p * last;
    for (const r of s.runs) {
      const i0 = Math.floor(r.a * last), i1 = Math.min(Math.ceil(r.b * last), Math.ceil(reach));
      if (i1 <= i0) continue;
      const g = r.front ? front : back;
      g.strokeStyle = STEM; g.lineWidth = s.w; g.lineCap = 'round'; g.lineJoin = 'round';
      smooth(g, s.pts, i0, i1);
    }
  }

  function drawLeaf(l, now) {
    const s = spring((now - l.t0) / 450);
    if (s <= 0) return;
    const g = l.front ? front : back, L = l.L * s, wd = L * 0.38;
    g.save(); g.translate(l.x, l.y); g.rotate(l.ang);
    g.beginPath(); g.moveTo(0, 0);
    g.quadraticCurveTo(L * 0.5, -wd, L, 0);
    g.quadraticCurveTo(L * 0.5, wd, 0, 0);
    g.fillStyle = l.col; g.fill();
    g.beginPath(); g.moveTo(L * 0.1, 0); g.lineTo(L * 0.8, 0);
    g.strokeStyle = VEIN; g.lineWidth = Math.max(1, L * 0.04); g.stroke();
    g.restore();
  }

  function petal(g, len, wid) {        // a rounded petal pointing along +x from the centre
    g.beginPath(); g.moveTo(0, 0);
    g.bezierCurveTo(len * 0.3, -wid, len, -wid * 0.8, len, 0);
    g.bezierCurveTo(len, wid * 0.8, len * 0.3, wid, 0, 0);
    g.fill();
  }

  function drawFlower(f, now) {

            const MIN_MS = still ? 0 : 2600;             // long enough for the name to flip into place

            const gate = $("gate"), nameEl = $("name"), illus = $("illus"), panel = $("panel");
            const pct = $("loader-pct"), text = $("loader-text");
            const form = $("staticrypt-form"), input = $("staticrypt-password"), remember = $("staticrypt-remember");
            const errorEl = $("gate-error"), eye = $("eye"), veil = $("veil");
            let busy = false, garden = null;

            function starSVG(size, color) {
                const p = (d) => `<path d="${d}" fill="${color}"/>`;
                return `<svg width="${size}" height="${size}" viewBox="0 0 72 72" fill="none" aria-hidden="true">` +
                    p("M36 4C36 4 38.5 26 36 36C33.5 26 36 4 36 4Z") + p("M36 68C36 68 33.5 46 36 36C38.5 46 36 68 36 68Z") +
                    p("M4 36C4 36 26 33.5 36 36C26 38.5 4 36 4 36Z") + p("M68 36C68 36 46 38.5 36 36C46 33.5 68 36 68 36Z") + `</svg>`;
            }

            /* ---------- Stars across the dark sheet ---------- */
            // [top, left, size, colour, delay ms, duration ms]
            const STARS = [
                ["9%", "7%", 58, "rgba(155,140,248,0.95)", 0, 580],
                ["14%", "78%", 34, "rgba(255,255,255,0.9)", 65, 495],
                ["42%", "91%", 50, "rgba(6,182,212,0.85)", 115, 560],
                ["6%", "48%", 18, "rgba(255,255,255,0.75)", 30, 425],
                ["70%", "11%", 40, "rgba(255,255,255,0.85)", 85, 515],
                ["63%", "68%", 26, "rgba(249,115,22,0.9)", 145, 450],
                ["28%", "35%", 16, "rgba(255,255,255,0.65)", 70, 395],
                ["88%", "83%", 46, "rgba(168,85,247,0.85)", 45, 540],
                ["22%", "58%", 30, "rgba(255,255,255,0.8)", 105, 450],
                ["80%", "42%", 20, "rgba(132,204,22,0.85)", 155, 415],
                ["52%", "22%", 42, "rgba(255,255,255,0.85)", 125, 495],
                ["4%", "90%", 22, "rgba(255,255,255,0.7)", 185, 430],
                ["75%", "57%", 14, "rgba(6,182,212,0.7)", 20, 360],
                ["36%", "82%", 36, "rgba(155,140,248,0.8)", 80, 470],
            ];
            function scatterStars() {
                for (const [top, left, size, colour, delay, dur] of STARS) {
                    const el = document.createElement("div");
                    el.className = "spark";
                    el.style.top = top;
                    el.style.left = left;
                    el.style.setProperty("--d", dur + "ms");
                    el.innerHTML = starSVG(size, colour);
                    gate.insertBefore(el, gate.firstChild);
                    setTimeout(() => el.classList.add("on"), still ? 0 : delay);
                }
            }
            // Three quick sparkles round the picture once it has filled
            function popSparkles() {
                if (still) return;
                const art = illus.getBoundingClientRect(), g = gate.getBoundingClientRect();
                [[0.86, 0.12, 54, "rgba(255,255,255,0.85)", 0], [0.78, 0.52, 32, "rgba(155,140,248,0.9)", 60], [0.52, 0.8, 22, "rgba(6,182,212,0.85)", 110]]
                    .forEach(([fx, fy, size, colour, delay]) => setTimeout(() => {
                        const el = document.createElement("div");
                        el.className = "spark pop";
                        el.style.left = art.left - g.left + art.width * fx - size / 2 + "px";
                        el.style.top = art.top - g.top + art.height * fy - size / 2 + "px";
                        el.innerHTML = starSVG(size, colour);
                        gate.appendChild(el);
                        setTimeout(() => el.remove(), 540);
                    }, delay));
            }

            /* ---------- The name, flipping into place letter by letter ---------- */
            const FLAPS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@!$%&";
            const flap = () => FLAPS[Math.floor(Math.random() * FLAPS.length)];
            function flipName() {
                return new Promise((resolve) => {
                    const letters = [];
                    for (const ch of NAME) {
                        const span = document.createElement("span");
                        span.className = ch === " " ? "sp" : "l";
                        span.setAttribute("aria-hidden", "true");
                        nameEl.appendChild(span);
                        if (ch !== " ") letters.push([span, ch]);
                    }
                    if (still) {
                        letters.forEach(([span, ch]) => { span.textContent = ch; span.classList.add("in"); });
                        return resolve();
                    }
                    // Like a split-flap board: flaps start fast and slow down before each letter lands
                    const CYCLES = 12, gap = (k) => 28 + 560 * Math.pow(k / CYCLES, 3.2);
                    let settled = 0;
                    letters.forEach(([span, ch], i) => {
                        let cycle = 0;
                        span.textContent = flap();
                        const flipOnce = () => {
                            if (++cycle < CYCLES) {
                                span.textContent = flap();
                                span.style.color = `rgba(155,140,248,${(0.15 + (cycle / CYCLES) * 0.55).toFixed(2)})`;
                                setTimeout(flipOnce, gap(cycle));
                            } else {
                                span.textContent = ch;
                                span.style.color = "";
                                span.classList.add("in");
                                if (garden) garden.grow(span);
                                if (++settled === letters.length) resolve();
                            }
                        };
                        setTimeout(flipOnce, i * 60);
                    });
                });
            }

            /* ---------- Loading: the picture fills in left to right ---------- */
            // A wavy edge sweeps across the picture as the page loads, flattening out as it nears the end.
            function fillTo(p, now) {
                if (p >= 1) { illus.style.clipPath = "none"; return; }
                const pts = ["0% 0%"], STEPS = 36, amp = 5 * (1 - p * p), t = now / 1000;
                for (let i = 0; i <= STEPS; i++) {
                    const wave = Math.sin((i / STEPS) * Math.PI * 5 - t * Math.PI * 2.6) * amp;
                    pts.push(`${Math.min(110, p * 100 + wave).toFixed(2)}% ${((i / STEPS) * 100).toFixed(2)}%`);
                }
                pts.push("0% 100%");
                illus.style.clipPath = `polygon(${pts.join(", ")})`;
            }

            // Loading follows the illustration and the fonts, never faster than MIN_MS.
            function load() {
                return new Promise((resolve) => {
                    let ready = 0;
                    const parts = 2;
                    illus.onload = illus.onerror = () => { ready++; };
                    illus.src = ILLUS;
                    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ready++; });
                    const start = performance.now();
                    let shown = 0;
                    const tick = (now) => {
                        const time = MIN_MS ? Math.min((now - start) / MIN_MS, 1) : 1;
                        const target = Math.min(time, ready / parts);
                        shown += (target - shown) * (still ? 1 : 0.08);
                        if (target >= 1 && shown > 0.995) shown = 1;
                        fillTo(shown, now);
                        const v = Math.round(shown * 100);
                        pct.textContent = v + "%";
                        illus.setAttribute("aria-valuenow", String(v));
                        if (shown >= 1) { popSparkles(); return resolve(); }
                        requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                });
            }

            function showPassword() {
                text.textContent = "Come in";
                pct.textContent = "";
                illus.removeAttribute("role");
                form.removeAttribute("aria-hidden");
                form.querySelectorAll("[tabindex='-1']").forEach((el) => el.removeAttribute("tabindex"));
                form.classList.add("ready");
                input.focus({ preventScroll: window.innerWidth >= 900 });
            }

            /* ---------- Going in ---------- */
            // A first visit to the homepage opens on the hi-fi site (index.html
            // carries the marker); once someone picks a version, the switch decides.
            function firstVisitToHifi(html) {
                let chosen = null;
                try { chosen = localStorage.getItem("portfolio.fi"); } catch (e) {}
                return !chosen && remember.checked && html.includes("/*hifi-first*/");
            }
            // The colour the next page opens on, so the last moment fades into it
            function pageColour(html) {
                const m = html.match(/body\s*\{[^}]*?background(?:-color)?\s*:\s*(#[0-9a-f]{3,8})/i);
                return m ? m[1] : "#ffffff";
            }

            async function goIn(colour) {
                document.documentElement.style.overflow = "hidden";
                document.body.classList.add("leaving");
                await wait(350);
                // Move into the picture: it grows past the edges of the screen
                const r = illus.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
                const S = Math.max(vw / r.width, vh / r.height) * 1.25;
                illus.style.transform = `translate(${vw / 2 - (r.left + r.width / 2)}px, ${vh / 2 - (r.top + r.height / 2)}px) scale(${S})`;
                illus.style.borderRadius = "0";
                await wait(1300);
                veil.style.background = colour;
                veil.classList.add("on");
                await wait(400);
            }

            input.addEventListener("input", () => { errorEl.textContent = ""; });

            eye.addEventListener("click", () => {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                eye.textContent = show ? "Hide" : "Show";
                eye.setAttribute("aria-pressed", String(show));
                input.focus();
            });

            panel.addEventListener("animationend", () => panel.classList.remove("shake"));

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    $("staticrypt_loading").classList.add("hidden");
                    $("staticrypt_content").classList.remove("hidden");
                    if (isRememberEnabled) $("staticrypt-remember-label").classList.remove("hidden");
                    if (window.introGarden) garden = window.introGarden(gate, { reach: 1.4 });
                    scatterStars();
                    await Promise.all([load(), flipName()]);
                    // let the last flowers open, but don't keep anyone waiting on them
                    await wait(still ? 0 : Math.min(garden ? garden.remaining() : 0, 1200) + 200);
                    showPassword();
                }
            };

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                if (busy || !form.classList.contains("ready")) return;

                const password = input.value;
                if (!password) {
                    errorEl.textContent = "Type the password first.";
                    input.focus();
                    return;
                }

                busy = true;
                holdPage = true;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember.checked);

                if (!isSuccessful) {
                    holdPage = false;
                    panel.classList.add("shake");
                    errorEl.textContent = "That's not the password. Check the spelling; capitals count.";
                    input.select();
                    busy = false;
                    return;
                }

                const toHifi = firstVisitToHifi(pendingPage);
                if (!still) await goIn(toHifi ? "#ffffff" : pageColour(pendingPage));
                if (toHifi) return location.replace("hifi/");
                document.write(pendingPage);
                document.close();
            });
          })();
        </script>
    </body>
</html>
